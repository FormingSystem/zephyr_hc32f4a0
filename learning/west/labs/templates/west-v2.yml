manifest:
  version: "1.2"
  group-filter: [-docs]
  projects:
    - name: app
      url: ../../remotes/app
      revision: v1.0
      path: app
    - name: arithmetic
      url: ../../../remotes/arithmetic
      revision: v2.0
      path: libs/arithmetic
    - name: guide
      url: ../../../remotes/guide
      revision: v1.0
      path: docs/guide
      groups: [docs]
  self:
    path: manifest
    west-commands: west-commands.yml
