<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">按钮、CPU、存储与指示灯之间的数据和指令路径</title>
<desc id="desc">按钮、CPU、存储与指示灯之间的数据和指令路径。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="20" y="130" width="140" height="80" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="90.0" y="164.0" text-anchor="middle" font-weight="700">按钮</text>
<text x="90.0" y="188.0" text-anchor="middle">改变输入电平</text>
<rect x="220" y="130" width="140" height="80" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="290.0" y="164.0" text-anchor="middle" font-weight="700">GPIO 输入</text>
<text x="290.0" y="188.0" text-anchor="middle">提供当前状态</text>
<rect x="420" y="130" width="130" height="80" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="485.0" y="164.0" text-anchor="middle" font-weight="700">CPU</text>
<text x="485.0" y="188.0" text-anchor="middle">判断并计算</text>
<rect x="605" y="130" width="135" height="80" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="672.5" y="164.0" text-anchor="middle" font-weight="700">GPIO 输出</text>
<text x="672.5" y="188.0" text-anchor="middle">驱动 LED</text>
<rect x="405" y="20" width="160" height="65" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="485.0" y="46.5" text-anchor="middle" font-weight="700">程序存储器</text>
<text x="485.0" y="70.5" text-anchor="middle">保存指令</text>
<polyline points="160,170 220,170" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<text x="170" y="155" text-anchor="start" fill="#1769aa">电平</text>
<polyline points="360,170 420,170" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<text x="381" y="155" text-anchor="start" fill="#1769aa">读</text>
<polyline points="550,170 605,170" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<text x="566" y="155" text-anchor="start" fill="#217346">写</text>
<polyline points="485,85 485,130" fill="none" stroke="#7540a0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#purple)"/>
<text x="24" y="262" text-anchor="start" font-weight="700">① 读取输入  →  ② 执行程序  →  ③ 输出硬件保持结果</text>
<line x1="24" y1="323" x2="48" y2="323" stroke="#1769aa"/>
<text x="54" y="328" text-anchor="start">数据</text>
<line x1="108" y1="323" x2="132" y2="323" stroke="#7540a0"/>
<text x="138" y="328" text-anchor="start">指令供给</text>
<line x1="224" y1="323" x2="248" y2="323" stroke="#217346"/>
<text x="254" y="328" text-anchor="start">输出</text>
</g></svg>