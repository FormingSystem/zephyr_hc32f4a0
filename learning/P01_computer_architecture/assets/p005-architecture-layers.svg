<rect x="25" y="225" width="710" height="60" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="380.0" y="261.0" text-anchor="middle" font-weight="700">STM32H743：集成 M7、Flash、RAM、互连与外设</text>
