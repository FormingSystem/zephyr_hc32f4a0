<svg xmlns="http://www.w3.org/2000/svg" width="800" height="401" viewBox="0 0 800 401" role="img" aria-labelledby="title desc">
  <title id="title">一条使用 SP 的指令会读哪份栈指针</title>
  <desc id="desc">Cortex-M7 · 当前只有一个执行上下文。在普通程序里读 SP，要结合 CONTROL.SPSEL 判断；进入异常处理后，处理程序看到的是 MSP。两份栈指针属于同一颗核。</desc>
  <rect width="800" height="401" fill="#ffffff"/>
  <path d="M400 86 V103 M203 103 H597" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M203 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M203 170 V187" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M203 233 V250" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M203 320 V337" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M597 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M597 170 V187" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M597 233 V250" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M597 296 V313" fill="none" stroke="#705197" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="74" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">Cortex-M7 · 当前只有一个执行上下文</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">r13 / SP</text>
  <rect x="14" y="124" width="378" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="203" y="152" font-size="17" font-weight="700" fill="#25618b">Thread 模式</text>
  <rect x="14" y="187" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="215" font-size="16" font-weight="400" fill="#182e3d">读取 CONTROL.SPSEL</text>
  <rect x="14" y="250" width="378" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="278" font-size="16" font-weight="400" fill="#182e3d">位 1 为 0，使用 MSP</text>
  <text x="203" y="302" font-size="16" font-weight="400" fill="#182e3d">位 1 为 1，使用 PSP</text>
  <rect x="14" y="337" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="365" font-size="16" font-weight="400" fill="#182e3d">切换到 PSP 前由软件设置栈顶</text>
  <rect x="408" y="124" width="378" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="597" y="152" font-size="17" font-weight="700" fill="#705197">Handler 模式</text>
  <rect x="408" y="187" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="597" y="215" font-size="16" font-weight="400" fill="#182e3d">异常处理固定使用 MSP</text>
  <rect x="408" y="250" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="597" y="278" font-size="16" font-weight="400" fill="#182e3d">处理程序中的 SP 指向主栈</text>
  <rect x="408" y="313" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="597" y="341" font-size="16" font-weight="400" fill="#182e3d">被打断程序的异常帧仍在入栈时选用的栈中</text>
  </g>
</svg>
