<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img"><title>同一个 r13 按执行模式选择 MSP 或 PSP</title><desc>原创教学关系图；颜色与箭头含义见本图图例和正文，不代表物理布局或实测周期。</desc><defs>
<marker id="a1469aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#1469aa"/></marker>
<marker id="a7944ad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#7944ad"/></marker>
<marker id="a22764a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#22764a"/></marker>
<marker id="aae5711" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#ae5711"/></marker>
<marker id="a607181" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#607181"/></marker>
</defs>
<rect width="760" height="450" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#203347">
<rect x="24" y="35" width="230" height="85" rx="6" fill="#eaf3ff" stroke="#1469aa" stroke-width="1.5"/>
<text x="139.0" y="59.5" text-anchor="middle" font-weight="700">Thread 模式</text>
<text x="139.0" y="83.5" text-anchor="middle">执行普通程序</text>
<text x="139.0" y="107.5" text-anchor="middle">不等于 RTOS 线程对象</text>
<rect x="310" y="35" width="426" height="85" rx="6" fill="#f3edfa" stroke="#7944ad" stroke-width="1.5"/>
<text x="523.0" y="71.5" text-anchor="middle" font-weight="700">CONTROL.SPSEL（位 1）</text>
<text x="523.0" y="95.5" text-anchor="middle">0：选 MSP；1：选 PSP</text>
<path d="M254 78 H310" fill="none" stroke="#7944ad" stroke-width="2" marker-end="url(#a7944ad)"/>
<rect x="24" y="200" width="230" height="85" rx="6" fill="#fff2e6" stroke="#ae5711" stroke-width="1.5"/>
<text x="139.0" y="224.5" text-anchor="middle" font-weight="700">Handler 模式</text>
<text x="139.0" y="248.5" text-anchor="middle">执行异常处理</text>
<text x="139.0" y="272.5" text-anchor="middle">固定使用 MSP</text>
<rect x="310" y="175" width="190" height="85" rx="6" fill="#eaf5ed" stroke="#22764a" stroke-width="1.5"/>
<text x="405.0" y="199.5" text-anchor="middle" font-weight="700">MSP</text>
<text x="405.0" y="223.5" text-anchor="middle">主栈指针</text>
<text x="405.0" y="247.5" text-anchor="middle">复位后先使用它</text>
<rect x="546" y="175" width="190" height="85" rx="6" fill="#eaf5ed" stroke="#22764a" stroke-width="1.5"/>
<text x="641.0" y="199.5" text-anchor="middle" font-weight="700">PSP</text>
<text x="641.0" y="223.5" text-anchor="middle">进程栈指针</text>
<text x="641.0" y="247.5" text-anchor="middle">须先正确初始化</text>
<path d="M398 120 V175" fill="none" stroke="#7944ad" stroke-width="2" marker-end="url(#a7944ad)"/>
<path d="M642 120 V175" fill="none" stroke="#7944ad" stroke-width="2" marker-end="url(#a7944ad)"/>
<path d="M254 243 H310" fill="none" stroke="#ae5711" stroke-width="2" marker-end="url(#aae5711)"/>
<rect x="310" y="325" width="426" height="55" rx="6" fill="#f3edfa" stroke="#7944ad" stroke-width="1.5"/>
<text x="523.0" y="358.5" text-anchor="middle" font-weight="700">r13 / SP：本次指令使用选中的指针</text>
<path d="M405 260 V325" fill="none" stroke="#22764a" stroke-width="2" marker-end="url(#a22764a)"/>
<path d="M641 260 V325" fill="none" stroke="#22764a" stroke-width="2" marker-end="url(#a22764a)"/>
<text x="24" y="314" text-anchor="start">这仍然只有一个 CPU。</text>
<text x="24" y="347" text-anchor="start">两个指针不自动产生任务；</text>
<text x="24" y="374" text-anchor="start">保存、恢复与调度由软件组织。</text>
<text x="24" y="426" text-anchor="start">蓝：普通执行　橙：异常执行　紫：选择规则　绿：两份栈指针状态</text>
</g></svg>
