<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">地址译码选择存储器与外设并返回响应</title>
<desc id="desc">地址译码选择存储器与外设并返回响应。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="20" y="130" width="150" height="85" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="95.0" y="166.5" text-anchor="middle" font-weight="700">CPU 接口</text>
<text x="95.0" y="190.5" text-anchor="middle">地址 / 读写 / 宽度</text>
<rect x="260" y="130" width="170" height="85" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="345.0" y="166.5" text-anchor="middle" font-weight="700">地址译码与互连</text>
<text x="345.0" y="190.5" text-anchor="middle">选择目标</text>
<rect x="550" y="25" width="180" height="70" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="640.0" y="54.0" text-anchor="middle" font-weight="700">Flash</text>
<text x="640.0" y="78.0" text-anchor="middle">指令与常量</text>
<rect x="550" y="130" width="180" height="70" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="640.0" y="159.0" text-anchor="middle" font-weight="700">SRAM</text>
<text x="640.0" y="183.0" text-anchor="middle">工作数据</text>
<rect x="550" y="235" width="180" height="70" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="640.0" y="264.0" text-anchor="middle" font-weight="700">GPIO</text>
<text x="640.0" y="288.0" text-anchor="middle">状态与控制</text>
<polyline points="170,152 260,152" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<text x="194" y="140" text-anchor="start" fill="#1769aa">请求</text>
<polyline points="430,160 485,160 485,60 550,60" fill="none" stroke="#7540a0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#purple)"/>
<polyline points="430,160 485,160 485,165 550,165" fill="none" stroke="#7540a0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#purple)"/>
<polyline points="430,160 485,160 485,270 550,270" fill="none" stroke="#7540a0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#purple)"/>
<polyline points="550,291 510,291 510,330 95,330 95,215" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<text x="200" y="320" text-anchor="start" fill="#217346">目标响应：读回数据 / 完成 / 错误</text>
<line x1="24" y1="363" x2="48" y2="363" stroke="#1769aa"/>
<text x="54" y="368" text-anchor="start">访问请求</text>
<line x1="140" y1="363" x2="164" y2="363" stroke="#7540a0"/>
<text x="170" y="368" text-anchor="start">按地址选择</text>
<line x1="272" y1="363" x2="296" y2="363" stroke="#217346"/>
<text x="302" y="368" text-anchor="start">响应</text>
