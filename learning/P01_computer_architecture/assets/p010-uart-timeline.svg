<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">CPU 提交数据后 UART 独立发送 8N1 帧</title>
<desc id="desc">CPU 提交数据后 UART 独立发送 8N1 帧。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<text x="22" y="67" text-anchor="start">CPU</text>
<rect x="130" y="40" width="590" height="40" rx="8" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<rect x="130" y="40" width="11.8" height="40" fill="#1769aa"/>
<text x="215" y="66" text-anchor="start">提交后可执行其他工作，不必忙等</text>
<polyline points="136,40 136,22 330,22" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<text x="340" y="28" text-anchor="start">提交 2 μs：教学假设</text>
<text x="22" y="153" text-anchor="start">UART TX</text>
<rect x="141.8" y="120" width="51.212" height="54" rx="0" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="167.406" y="152" text-anchor="middle">起始</text>
<rect x="193.012" y="120" width="51.212" height="54" rx="0" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="218.618" y="152" text-anchor="middle">D0</text>
<rect x="244.224" y="120" width="51.212" height="54" rx="0" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="269.83" y="152" text-anchor="middle">D1</text>
<rect x="295.43600000000004" y="120" width="51.212" height="54" rx="0" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="321.04200000000003" y="152" text-anchor="middle">D2</text>
<rect x="346.648" y="120" width="51.212" height="54" rx="0" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="372.254" y="152" text-anchor="middle">D3</text>
<rect x="397.86" y="120" width="51.212" height="54" rx="0" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="423.466" y="152" text-anchor="middle">D4</text>
<rect x="449.072" y="120" width="51.212" height="54" rx="0" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="474.678" y="152" text-anchor="middle">D5</text>
<rect x="500.284" y="120" width="51.212" height="54" rx="0" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="525.89" y="152" text-anchor="middle">D6</text>
<rect x="551.4960000000001" y="120" width="51.212" height="54" rx="0" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="577.1020000000001" y="152" text-anchor="middle">D7</text>
<rect x="602.7080000000001" y="120" width="51.212" height="54" rx="0" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="628.3140000000001" y="152" text-anchor="middle">停止</text>
<line x1="130.0" y1="196" x2="130.0" y2="202" stroke="#667080"/>
<text x="130.0" y="225" text-anchor="middle">0</text>
<line x1="248.0" y1="196" x2="248.0" y2="202" stroke="#667080"/>
<text x="248.0" y="225" text-anchor="middle">20</text>
<line x1="366.0" y1="196" x2="366.0" y2="202" stroke="#667080"/>
<text x="366.0" y="225" text-anchor="middle">40</text>
<line x1="484.0" y1="196" x2="484.0" y2="202" stroke="#667080"/>
<text x="484.0" y="225" text-anchor="middle">60</text>
<line x1="602.0" y1="196" x2="602.0" y2="202" stroke="#667080"/>
<text x="602.0" y="225" text-anchor="middle">80</text>
<line x1="720.0" y1="196" x2="720.0" y2="202" stroke="#667080"/>
<text x="720.0" y="225" text-anchor="middle">100</text>
<text x="22" y="224" text-anchor="start">时间 / μs</text>
<text x="24" y="274" text-anchor="start">115200、8N1：10 位 × 8.68 μs ≈ 86.8 μs</text>
<text x="24" y="309" text-anchor="start">外设发送期间，CPU 和 UART 是两个独立硬件执行者。</text>
<line x1="24" y1="353" x2="48" y2="353" stroke="#1769aa"/>
<text x="54" y="358" text-anchor="start">CPU 提交</text>
<line x1="172" y1="353" x2="196" y2="353" stroke="#b45b13"/>
<text x="202" y="358" text-anchor="start">硬件发送</text>
<line x1="288" y1="353" x2="312" y2="353" stroke="#667080"/>
<text x="318" y="358" text-anchor="start">CPU 不处理本事务</text>
</g></svg>
