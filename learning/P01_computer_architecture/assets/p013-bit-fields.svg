<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img"><title>控制帧位域提取与替换的数值变化</title><desc>原创教学关系图；颜色与箭头含义见本图图例和正文，不代表物理布局或实测周期。</desc><defs>
<marker id="a1469aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#1469aa"/></marker>
<marker id="a7944ad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#7944ad"/></marker>
<marker id="a22764a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#22764a"/></marker>
<marker id="aae5711" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#ae5711"/></marker>
<marker id="a607181" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#607181"/></marker>
</defs>
<rect width="760" height="440" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#203347">
<rect x="24" y="25" width="712" height="66" rx="6" fill="#eaf3ff" stroke="#1469aa" stroke-width="1.5"/>
<text x="380.0" y="52.0" text-anchor="middle" font-weight="700">输入 frame = 0x000000B3；mode 字段占位 6–4</text>
<text x="380.0" y="76.0" text-anchor="middle">低 8 位：1 | 011 | 0011（位 7 | mode | 位 3–0）</text>
<rect x="24" y="150" width="332" height="86" rx="6" fill="#f3edfa" stroke="#7944ad" stroke-width="1.5"/>
<text x="190.0" y="175.0" text-anchor="middle" font-weight="700">提取：右移 4 位后取低 3 位</text>
<text x="190.0" y="199.0" text-anchor="middle">(frame &gt;&gt; 4) &amp; 7</text>
<text x="190.0" y="223.0" text-anchor="middle">得到 3</text>
<rect x="404" y="150" width="332" height="86" rx="6" fill="#fff2e6" stroke="#ae5711" stroke-width="1.5"/>
<text x="570.0" y="175.0" text-anchor="middle" font-weight="700">替换：新 mode = 5</text>
<text x="570.0" y="199.0" text-anchor="middle">清位掩码 0x70；新字段 0x50</text>
<text x="570.0" y="223.0" text-anchor="middle">原值清位后为 0x83</text>
<path d="M190 91 V150" fill="none" stroke="#7944ad" stroke-width="2" marker-end="url(#a7944ad)"/>
<path d="M570 91 V150" fill="none" stroke="#ae5711" stroke-width="2" marker-end="url(#aae5711)"/>
<rect x="24" y="290" width="332" height="66" rx="6" fill="#f3edfa" stroke="#7944ad" stroke-width="1.5"/>
<text x="190.0" y="317.0" text-anchor="middle" font-weight="700">UBFX r0, r0, #4, #3</text>
<text x="190.0" y="341.0" text-anchor="middle">起始位 4，提取宽度 3</text>
<rect x="404" y="290" width="332" height="66" rx="6" fill="#eaf5ed" stroke="#22764a" stroke-width="1.5"/>
<text x="570.0" y="317.0" text-anchor="middle" font-weight="700">0x83 | 0x50 = 0xD3</text>
<text x="570.0" y="341.0" text-anchor="middle">位 7 与位 3–0 均保留</text>
<path d="M190 236 V290" fill="none" stroke="#7944ad" stroke-width="2" marker-end="url(#a7944ad)"/>
<path d="M570 236 V290" fill="none" stroke="#22764a" stroke-width="2" marker-end="url(#a22764a)"/>
<text x="24" y="393" text-anchor="start">这是普通数值的位操作；外设寄存器能否读改写，要另查硬件语义。</text>
<text x="24" y="425" text-anchor="start">蓝：原值　紫：提取　橙：准备替换　绿：合并结果</text>
</g></svg>
