<rect x="16" y="16" width="728" height="424" rx="10" fill="#fafbfd" stroke="#607181"/>
<text x="30" y="42" text-anchor="start" font-weight="700">Cortex-M7 核侧功能示意：方框按职责组织，不是芯片版图</text>
