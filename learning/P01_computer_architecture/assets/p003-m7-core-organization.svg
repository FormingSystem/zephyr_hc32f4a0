<text x="186.0" y="94.0" text-anchor="middle" font-weight="700">取指 / 分支处理</text>
<text x="186.0" y="118.0" text-anchor="middle">PC 定位；可用 I-Cache</text>
<rect x="424" y="60" width="300" height="80" rx="6" fill="#f3edfa" stroke="#7944ad" stroke-width="1.5"/>
<text x="574.0" y="94.0" text-anchor="middle" font-weight="700">译码 / 发射</text>
<text x="574.0" y="118.0" text-anchor="middle">识别操作与依赖</text>
<rect x="36" y="190" width="300" height="80" rx="6" fill="#eaf3ff" stroke="#1469aa" stroke-width="1.5"/>
<text x="186.0" y="224.0" text-anchor="middle" font-weight="700">寄存器与状态</text>
<text x="186.0" y="248.0" text-anchor="middle">r0–r15 / xPSR</text>
<rect x="424" y="190" width="300" height="80" rx="6" fill="#fff2e6" stroke="#ae5711" stroke-width="1.5"/>
<text x="574.0" y="224.0" text-anchor="middle" font-weight="700">整数执行</text>
<text x="574.0" y="248.0" text-anchor="middle">算术 / 移位 / 乘除</text>
<rect x="36" y="330" width="300" height="80" rx="6" fill="#eaf5ed" stroke="#22764a" stroke-width="1.5"/>
<text x="186.0" y="352.0" text-anchor="middle" font-weight="700">加载 / 存储单元</text>
<text x="186.0" y="376.0" text-anchor="middle">按地址和属性选择通路</text>
<text x="186.0" y="400.0" text-anchor="middle">D-Cache 或专用 / 系统接口</text>
<rect x="424" y="330" width="300" height="80" rx="6" fill="#fff2e6" stroke="#ae5711" stroke-width="1.5"/>
<text x="574.0" y="352.0" text-anchor="middle" font-weight="700">浮点执行单元</text>
<text x="574.0" y="376.0" text-anchor="middle">独立于整数寄存器的数据视图</text>
<text x="574.0" y="400.0" text-anchor="middle">按浮点指令执行</text>
