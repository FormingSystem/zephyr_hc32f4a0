<text x="186.0" y="533.0" text-anchor="middle">ITCM 或系统存储</text>
<rect x="424" y="480" width="300" height="70" rx="6" fill="#eaf5ed" stroke="#22764a" stroke-width="1.5"/>
<text x="574.0" y="509.0" text-anchor="middle" font-weight="700">数据来源 / 去向</text>
<text x="574.0" y="533.0" text-anchor="middle">DTCM、系统存储或片上外设</text>
