<text x="155.0" y="113.0" text-anchor="middle">填充</text>
<rect x="201" y="60" width="84" height="70" rx="8" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<text x="243.0" y="89.0" text-anchor="middle" font-weight="700">+2</text>
