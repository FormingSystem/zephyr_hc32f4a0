<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc">
<title id="title">从 C 输入到目标芯片执行的构建链</title>
<desc id="desc">从 C 输入到目标芯片执行的构建链。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="25" y="25" width="220" height="65" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="135.0" y="63.5" text-anchor="middle" font-weight="700">C / 头文件</text>
<rect x="270" y="25" width="220" height="65" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="380.0" y="63.5" text-anchor="middle" font-weight="700">预处理 → .i</text>
<rect x="515" y="25" width="220" height="65" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="625.0" y="63.5" text-anchor="middle" font-weight="700">编译 → .s</text>
<rect x="515" y="165" width="220" height="65" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="625.0" y="203.5" text-anchor="middle" font-weight="700">汇编 → .o</text>
<rect x="270" y="165" width="220" height="65" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="380.0" y="203.5" text-anchor="middle" font-weight="700">链接 → ELF</text>
<rect x="25" y="165" width="220" height="65" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="135.0" y="203.5" text-anchor="middle" font-weight="700">导出 BIN / HEX</text>
<polyline points="245,57 270,57" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<polyline points="490,57 515,57" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<polyline points="625,90 625,165" fill="none" stroke="#b45b13" stroke-width="2" marker-end="url(#orange)"/>
<polyline points="515,197 490,197" fill="none" stroke="#b45b13" stroke-width="2" marker-end="url(#orange)"/>
<polyline points="270,197 245,197" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<rect x="270" y="315" width="465" height="80" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="502.5" y="349.0" text-anchor="middle" font-weight="700">链接输入：各 .o + 启动对象 + 库</text>
<text x="502.5" y="373.0" text-anchor="middle">布局规则：代码 / 数据 / 向量放在哪里</text>
<polyline points="380,315 380,230" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<rect x="25" y="445" width="710" height="65" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="380.0" y="483.5" text-anchor="middle" font-weight="700">下载到存储 → 芯片复位 → 读取向量 → 执行启动代码</text>
<polyline points="135,230 135,445" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<line x1="24" y1="553" x2="48" y2="553" stroke="#1769aa"/>
<text x="54" y="558" text-anchor="start">源码</text>
<line x1="108" y1="553" x2="132" y2="553" stroke="#b45b13"/>
<text x="138" y="558" text-anchor="start">转换阶段</text>
<line x1="224" y1="553" x2="248" y2="553" stroke="#7540a0"/>
<text x="254" y="558" text-anchor="start">链接依赖</text>
<line x1="340" y1="553" x2="364" y2="553" stroke="#217346"/>
<text x="370" y="558" text-anchor="start">交付/执行</text>
</g></svg>