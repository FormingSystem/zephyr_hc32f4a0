<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" role="img" aria-labelledby="title desc">
<title id="title">LDRB 取一个字节，STRB 只更新一个字节</title>
<desc id="desc">LDRB 取一个字节，STRB 只更新一个字节。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<text x="25" y="35" text-anchor="start" font-weight="700">① LDRB r0, [r0, #1]：读取 +1</text>
<rect x="25" y="60" width="88" height="55" rx="8" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<text x="69.0" y="93.5" text-anchor="middle" font-weight="700">11</text>
<rect x="125" y="60" width="88" height="55" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="169.0" y="93.5" text-anchor="middle" font-weight="700">22</text>
<rect x="225" y="60" width="88" height="55" rx="8" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<text x="269.0" y="93.5" text-anchor="middle" font-weight="700">33</text>
<rect x="325" y="60" width="88" height="55" rx="8" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<text x="369.0" y="93.5" text-anchor="middle" font-weight="700">44</text>
<rect x="495" y="60" width="240" height="55" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="615.0" y="93.5" text-anchor="middle" font-weight="700">r0 = 0x00000022</text>
<polyline points="425,87 495,87" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<text x="25" y="158" text-anchor="start">地址：base+0      +1          +2          +3</text>
<text x="25" y="218" text-anchor="start" font-weight="700">② STRB r1, [r0, #1]：r1 的低八位为 AA</text>
<rect x="25" y="250" width="88" height="55" rx="8" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<text x="69.0" y="283.5" text-anchor="middle" font-weight="700">11</text>
<rect x="125" y="250" width="88" height="55" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="169.0" y="283.5" text-anchor="middle" font-weight="700">AA</text>
<rect x="225" y="250" width="88" height="55" rx="8" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<text x="269.0" y="283.5" text-anchor="middle" font-weight="700">33</text>
<rect x="325" y="250" width="88" height="55" rx="8" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<text x="369.0" y="283.5" text-anchor="middle" font-weight="700">44</text>
<rect x="495" y="250" width="240" height="55" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="615.0" y="283.5" text-anchor="middle" font-weight="700">r1 低八位 = 0xAA</text>
<polyline points="495,279 460,279 460,340 169,340 169,305" fill="none" stroke="#b45b13" stroke-width="2" marker-end="url(#orange)"/>
<text x="25" y="393" text-anchor="start">字节偏移 +1 合法；不要求起点先成为四字节的倍数。</text>
<line x1="24" y1="438" x2="48" y2="438" stroke="#1769aa"/>
<text x="54" y="443" text-anchor="start">被读字节</text>
<line x1="140" y1="438" x2="164" y2="438" stroke="#217346"/>
<text x="170" y="443" text-anchor="start">零扩展结果</text>
<line x1="272" y1="438" x2="296" y2="438" stroke="#b45b13"/>
<text x="302" y="443" text-anchor="start">写入</text>
<line x1="356" y1="438" x2="380" y2="438" stroke="#667080"/>
<text x="386" y="443" text-anchor="start">邻居不变</text>
</g></svg>