<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">外层调用内层再返回时的栈空间</title>
<desc id="desc">外层调用内层再返回时的栈空间。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<text x="130" y="35" text-anchor="middle" font-weight="700">① 外层已分配</text>
<text x="130" y="80" text-anchor="middle">高端 0x20001000</text>
<rect x="20" y="100" width="220" height="85" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="130.0" y="136.5" text-anchor="middle" font-weight="700">外层帧 16 字节</text>
<text x="130.0" y="160.5" text-anchor="middle">保持有效</text>
<rect x="20" y="185" width="220" height="65" rx="8" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<text x="130.0" y="223.5" text-anchor="middle" font-weight="700">当前未分配</text>
<line x1="20" y1="185" x2="240" y2="185" stroke="#7540a0"/>
<text x="130" y="298" text-anchor="middle" fill="#7540a0">SP = 0x20000FF0</text>
<text x="380" y="35" text-anchor="middle" font-weight="700">② 内层已分配</text>
<text x="380" y="80" text-anchor="middle">高端 0x20001000</text>
<rect x="270" y="100" width="220" height="85" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="380.0" y="136.5" text-anchor="middle" font-weight="700">外层帧 16 字节</text>
<text x="380.0" y="160.5" text-anchor="middle">保持有效</text>
<rect x="270" y="185" width="220" height="65" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="380.0" y="223.5" text-anchor="middle" font-weight="700">内层帧 8 字节</text>
<line x1="270" y1="250" x2="490" y2="250" stroke="#7540a0"/>
<text x="380" y="298" text-anchor="middle" fill="#7540a0">SP = 0x20000FE8</text>
<text x="630" y="35" text-anchor="middle" font-weight="700">③ 内层已返回</text>
<text x="630" y="80" text-anchor="middle">高端 0x20001000</text>
<rect x="520" y="100" width="220" height="85" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="630.0" y="136.5" text-anchor="middle" font-weight="700">外层帧 16 字节</text>
<text x="630.0" y="160.5" text-anchor="middle">保持有效</text>
<rect x="520" y="185" width="220" height="65" rx="8" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<text x="630.0" y="223.5" text-anchor="middle" font-weight="700">当前未分配</text>
<line x1="520" y1="185" x2="740" y2="185" stroke="#7540a0"/>
<text x="630" y="298" text-anchor="middle" fill="#7540a0">SP = 0x20000FF0</text>
<text x="25" y="355" text-anchor="start">地址向下减小；释放归还使用权，不把 RAM 自动清零。</text>
<line x1="24" y1="413" x2="48" y2="413" stroke="#1769aa"/>
<text x="54" y="418" text-anchor="start">外层</text>
<line x1="108" y1="413" x2="132" y2="413" stroke="#b45b13"/>
<text x="138" y="418" text-anchor="start">内层</text>
<line x1="192" y1="413" x2="216" y2="413" stroke="#667080"/>
<text x="222" y="418" text-anchor="start">可复用</text>
<line x1="292" y1="413" x2="316" y2="413" stroke="#7540a0"/>
<text x="322" y="418" text-anchor="start">当前栈边界</text>
</g></svg>