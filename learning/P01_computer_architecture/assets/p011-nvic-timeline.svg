<svg xmlns="http://www.w3.org/2000/svg" width="760" height="505" viewBox="0 0 760 505" role="img" aria-labelledby="title desc">
<title id="title">单核 CPU 的按钮与 UART 中断嵌套</title>
<desc id="desc">单核 CPU 的按钮与 UART 中断嵌套。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<text x="20" y="76" text-anchor="start">唯一 CPU</text>
<rect x="145" y="50" width="580" height="36" rx="0" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<rect x="145.0" y="50" width="145.0" height="36" fill="#1769aa"/>
<rect x="290.0" y="50" width="48.333333333333336" height="36" fill="#667080"/>
<rect x="338.33333333333337" y="50" width="96.66666666666667" height="36" fill="#b45b13"/>
<rect x="435.0" y="50" width="48.333333333333336" height="36" fill="#667080"/>
<rect x="483.3333333333333" y="50" width="96.66666666666667" height="36" fill="#7540a0"/>
<rect x="580.0" y="50" width="48.333333333333336" height="36" fill="#667080"/>
<rect x="628.3333333333333" y="50" width="48.333333333333336" height="36" fill="#b45b13"/>
<rect x="676.6666666666666" y="50" width="24.166666666666668" height="36" fill="#667080"/>
<rect x="700.8333333333334" y="50" width="24.166666666666668" height="36" fill="#1769aa"/>
<text x="20" y="141" text-anchor="start">主循环</text>
<rect x="145" y="115" width="580" height="36" rx="0" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<rect x="145.0" y="115" width="145.0" height="36" fill="#1769aa"/>
<rect x="700.8333333333334" y="115" width="24.166666666666668" height="36" fill="#1769aa"/>
<text x="20" y="206" text-anchor="start">按钮 ISR</text>
<rect x="145" y="180" width="580" height="36" rx="0" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<rect x="338.33333333333337" y="180" width="96.66666666666667" height="36" fill="#b45b13"/>
<rect x="628.3333333333333" y="180" width="48.333333333333336" height="36" fill="#b45b13"/>
<text x="20" y="271" text-anchor="start">UART ISR</text>
<rect x="145" y="245" width="580" height="36" rx="0" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<rect x="483.3333333333333" y="245" width="96.66666666666667" height="36" fill="#7540a0"/>
<text x="495.4166666666667" y="141" text-anchor="middle">主循环暂停</text>
<text x="217.5" y="206" text-anchor="middle">尚未请求</text>
<text x="531.6666666666667" y="206" text-anchor="middle">被抢占</text>
<text x="290.0" y="271" text-anchor="middle">尚未请求</text>
<text x="652.5" y="271" text-anchor="middle">处理结束</text>
<line x1="145.0" y1="301" x2="145.0" y2="307" stroke="#667080"/>
<text x="145.0" y="330" text-anchor="middle">0</text>
<line x1="241.66666666666669" y1="301" x2="241.66666666666669" y2="307" stroke="#667080"/>
<text x="241.66666666666669" y="330" text-anchor="middle">2</text>
<line x1="338.33333333333337" y1="301" x2="338.33333333333337" y2="307" stroke="#667080"/>
<text x="338.33333333333337" y="330" text-anchor="middle">4</text>
<line x1="435.0" y1="301" x2="435.0" y2="307" stroke="#667080"/>
<text x="435.0" y="330" text-anchor="middle">6</text>
<line x1="531.6666666666667" y1="301" x2="531.6666666666667" y2="307" stroke="#667080"/>
<text x="531.6666666666667" y="330" text-anchor="middle">8</text>
<line x1="628.3333333333333" y1="301" x2="628.3333333333333" y2="307" stroke="#667080"/>
<text x="628.3333333333333" y="330" text-anchor="middle">10</text>
<line x1="725.0" y1="301" x2="725.0" y2="307" stroke="#667080"/>
<text x="725.0" y="330" text-anchor="middle">12</text>
<text x="24" y="372" text-anchor="start">时间 / μs（教学假设）；深灰是异常入口/出口开销。</text>
<text x="24" y="399" text-anchor="start">蓝：主循环；橙：按钮；紫：UART；浅灰：本事务不执行。</text>
<text x="24" y="426" text-anchor="start">按钮在 3 μs 请求；UART 在 6 μs 请求并抢占按钮。</text>
<text x="24" y="453" text-anchor="start">按钮 6–10 μs 保持活动但未执行，UART 后先恢复按钮。</text>
</g></svg>
