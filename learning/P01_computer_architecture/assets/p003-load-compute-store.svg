<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">同一 CPU 执行加载计算存储的先后状态</title>
<desc id="desc">同一 CPU 执行加载计算存储的先后状态。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<text x="130" y="35" text-anchor="middle" fill="#1769aa" font-weight="700">① LDR</text>
<rect x="20" y="60" width="220" height="115" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="130.0" y="99.5" text-anchor="middle" font-weight="700">CPU 寄存器</text>
<text x="130.0" y="123.5" text-anchor="middle">r0 = 0x20000000</text>
<text x="130.0" y="147.5" text-anchor="middle">r3 = 7</text>
<rect x="20" y="255" width="220" height="75" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="130.0" y="286.5" text-anchor="middle" font-weight="700">RAM @ 0x20000000</text>
<text x="130.0" y="310.5" text-anchor="middle">内容 = 7</text>
<polyline points="130,255 130,175" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<text x="145" y="222" text-anchor="start" fill="#1769aa">读入</text>
<text x="380" y="35" text-anchor="middle" fill="#b45b13" font-weight="700">② ADDS</text>
<rect x="270" y="60" width="220" height="115" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="380.0" y="99.5" text-anchor="middle" font-weight="700">CPU 寄存器</text>
<text x="380.0" y="123.5" text-anchor="middle">r0 = 0x20000000</text>
<text x="380.0" y="147.5" text-anchor="middle">r3 = 8</text>
<rect x="270" y="255" width="220" height="75" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="380.0" y="286.5" text-anchor="middle" font-weight="700">RAM @ 0x20000000</text>
<text x="380.0" y="310.5" text-anchor="middle">内容 = 7</text>
<text x="380" y="222" text-anchor="middle" fill="#b45b13">只改变 r3</text>
<text x="630" y="35" text-anchor="middle" fill="#217346" font-weight="700">③ STR</text>
<rect x="520" y="60" width="220" height="115" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="630.0" y="99.5" text-anchor="middle" font-weight="700">CPU 寄存器</text>
<text x="630.0" y="123.5" text-anchor="middle">r0 = 0x20000000</text>
<text x="630.0" y="147.5" text-anchor="middle">r3 = 8</text>
<rect x="520" y="255" width="220" height="75" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="630.0" y="286.5" text-anchor="middle" font-weight="700">RAM @ 0x20000000</text>
<text x="630.0" y="310.5" text-anchor="middle">内容 = 8</text>
<polyline points="630,175 630,255" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<text x="645" y="222" text-anchor="start" fill="#217346">写回</text>
<text x="25" y="368" text-anchor="start">三个面板按先后阅读；不是三个 CPU 同时执行。</text>
<line x1="24" y1="393" x2="48" y2="393" stroke="#1769aa"/>
<text x="54" y="398" text-anchor="start">加载</text>
<line x1="108" y1="393" x2="132" y2="393" stroke="#b45b13"/>
<text x="138" y="398" text-anchor="start">计算</text>
<line x1="192" y1="393" x2="216" y2="393" stroke="#217346"/>
<text x="222" y="398" text-anchor="start">存储</text>
</g></svg>