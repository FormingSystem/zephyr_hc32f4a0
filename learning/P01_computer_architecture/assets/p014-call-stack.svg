<svg xmlns="http://www.w3.org/2000/svg" width="760" height="435" viewBox="0 0 760 435" role="img" aria-labelledby="title desc">
<title id="title">嵌套调用的两份栈帧与返回位置</title>
<desc id="desc">嵌套调用的两份栈帧与返回位置。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<text x="30" y="38" text-anchor="start" font-weight="700">栈向低地址增长 ↓</text>
<rect x="30" y="70" width="290" height="110" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="175.0" y="107.0" text-anchor="middle" font-weight="700">外层栈帧</text>
<text x="175.0" y="131.0" text-anchor="middle">保存调用者数据与返回信息</text>
<text x="175.0" y="155.0" text-anchor="middle">内层调用期间仍保留</text>
<rect x="30" y="210" width="290" height="110" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="175.0" y="247.0" text-anchor="middle" font-weight="700">内层栈帧（如有分配）</text>
<text x="175.0" y="271.0" text-anchor="middle">保存内层局部状态</text>
<text x="175.0" y="295.0" text-anchor="middle">返回后释放这一层</text>
<rect x="460" y="70" width="260" height="75" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="590.0" y="101.5" text-anchor="middle" font-weight="700">外层函数</text>
<text x="590.0" y="125.5" text-anchor="middle">调用前保存必要状态</text>
<rect x="460" y="235" width="260" height="75" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="590.0" y="266.5" text-anchor="middle" font-weight="700">内层函数</text>
<text x="590.0" y="290.5" text-anchor="middle">使用自己的局部状态</text>
<polyline points="540,145 540,235" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<text x="550" y="186" text-anchor="start" fill="#7540a0">调用</text>
<polyline points="680,235 680,145" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<text x="685" y="186" text-anchor="start" fill="#217346">返回</text>
<polyline points="460,110 320,110" fill="none" stroke="#667080" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gray)"/>
<polyline points="460,275 320,275" fill="none" stroke="#667080" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gray)"/>
<text x="30" y="361" text-anchor="start">叶函数可能不分配新栈帧；图示为一般嵌套关系。</text>
<line x1="24" y1="408" x2="48" y2="408" stroke="#1769aa"/>
<text x="54" y="413" text-anchor="start">外层</text>
<line x1="108" y1="408" x2="132" y2="408" stroke="#b45b13"/>
<text x="138" y="413" text-anchor="start">内层</text>
<line x1="192" y1="408" x2="216" y2="408" stroke="#7540a0"/>
<text x="222" y="413" text-anchor="start">调用</text>
<line x1="276" y1="408" x2="300" y2="408" stroke="#217346"/>
<text x="306" y="413" text-anchor="start">返回</text>
</g></svg>
