<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">CPU 向 DMA 交出发送缓冲区</title>
<desc id="desc">CPU 向 DMA 交出发送缓冲区。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="20" y="45" width="190" height="95" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="115.0" y="86.5" text-anchor="middle" font-weight="700">CPU / D-cache</text>
<text x="115.0" y="110.5" text-anchor="middle">新数据（可能为脏）</text>
<rect x="285" y="45" width="190" height="95" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="380.0" y="86.5" text-anchor="middle" font-weight="700">DMA 可达 RAM</text>
<text x="380.0" y="110.5" text-anchor="middle">等待更新</text>
<rect x="550" y="45" width="190" height="95" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="645.0" y="86.5" text-anchor="middle" font-weight="700">DMA → 外设</text>
<text x="645.0" y="110.5" text-anchor="middle">独立总线访问</text>
<polyline points="210,92 285,92" fill="none" stroke="#b45b13" stroke-width="2" marker-end="url(#orange)"/>
<polyline points="475,92 550,92" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<text x="25" y="205" text-anchor="start">① CPU 写好数据，准备完整缓存行范围。</text>
<text x="25" y="250" text-anchor="start">② Clean 写回并完成同步，再启动 DMA。</text>
<text x="25" y="295" text-anchor="start" font-weight="700">③ DMA 持有期间 CPU 不改；完成后归还缓冲区。</text>
<text x="25" y="348" text-anchor="start">维护方向与所有权同时正确；volatile 不能替代缓存维护。</text>
<line x1="24" y1="393" x2="48" y2="393" stroke="#1769aa"/>
<text x="54" y="398" text-anchor="start">CPU 数据</text>
<line x1="172" y1="393" x2="196" y2="393" stroke="#b45b13"/>
<text x="202" y="398" text-anchor="start">缓存维护</text>
<line x1="288" y1="393" x2="312" y2="393" stroke="#217346"/>
<text x="318" y="398" text-anchor="start">DMA 传输</text>
</g></svg>
