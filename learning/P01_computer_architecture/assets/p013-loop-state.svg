<rect x="166" y="111" width="198" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
<text x="265.0" y="138.5" text-anchor="middle" font-weight="700">0x20000000</text>
<rect x="370" y="111" width="100" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
<text x="420.0" y="138.5" text-anchor="middle" font-weight="700">3</text>
<rect x="476" y="111" width="110" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
<text x="531.0" y="138.5" text-anchor="middle" font-weight="700">0</text>
<rect x="592" y="111" width="144" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
<text x="664.0" y="138.5" text-anchor="middle" font-weight="700">尚未执行</text>
<rect x="24" y="162" width="136" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
<text x="92.0" y="189.5" text-anchor="middle" font-weight="700">第 1 轮</text>
<rect x="166" y="162" width="198" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
<text x="265.0" y="189.5" text-anchor="middle" font-weight="700">0x20000001</text>
<rect x="370" y="162" width="100" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
<text x="420.0" y="189.5" text-anchor="middle" font-weight="700">2</text>
<rect x="476" y="162" width="110" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
