<rect x="166" y="213" width="198" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
<text x="265.0" y="240.5" text-anchor="middle" font-weight="700">0x20000002</text>
<rect x="370" y="213" width="100" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
<text x="420.0" y="240.5" text-anchor="middle" font-weight="700">1</text>
<rect x="476" y="213" width="110" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
<text x="531.0" y="240.5" text-anchor="middle" font-weight="700">30</text>
<rect x="592" y="213" width="144" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
<text x="664.0" y="240.5" text-anchor="middle" font-weight="700">0 → 继续</text>
<rect x="24" y="264" width="136" height="43" rx="6" fill="#eaf5ed" stroke="#22764a" stroke-width="1.5"/>
<text x="92.0" y="291.5" text-anchor="middle" font-weight="700">第 3 轮</text>
<rect x="166" y="264" width="198" height="43" rx="6" fill="#eaf5ed" stroke="#22764a" stroke-width="1.5"/>
<text x="265.0" y="291.5" text-anchor="middle" font-weight="700">0x20000003</text>
<rect x="370" y="264" width="100" height="43" rx="6" fill="#eaf5ed" stroke="#22764a" stroke-width="1.5"/>
<text x="420.0" y="291.5" text-anchor="middle" font-weight="700">0</text>
<rect x="476" y="264" width="110" height="43" rx="6" fill="#eaf5ed" stroke="#22764a" stroke-width="1.5"/>
<text x="531.0" y="291.5" text-anchor="middle" font-weight="700">60</text>
<rect x="592" y="264" width="144" height="43" rx="6" fill="#eaf5ed" stroke="#22764a" stroke-width="1.5"/>
<text x="664.0" y="291.5" text-anchor="middle" font-weight="700">1 → 退出</text>
<rect x="24" y="340" width="336" height="60" rx="6" fill="#fff2e6" stroke="#ae5711" stroke-width="1.5"/>
<text x="192.0" y="364.0" text-anchor="middle" font-weight="700">循环体：读字节 → 累加 → 前移</text>
<text x="192.0" y="388.0" text-anchor="middle">SUBS 更新 Z，BNE 读取 Z</text>
<rect x="400" y="340" width="336" height="60" rx="6" fill="#eaf5ed" stroke="#22764a" stroke-width="1.5"/>
<text x="568.0" y="364.0" text-anchor="middle" font-weight="700">返回：MOV r0, r2；BX lr</text>
<text x="568.0" y="388.0" text-anchor="middle">r0 从地址用途变成返回值 60</text>
<path d="M360 370 H400" fill="none" stroke="#22764a" stroke-width="2" marker-end="url(#a22764a)"/>
<text x="24" y="440" text-anchor="start">蓝：输入角色　灰：中间状态　橙：每轮动作　紫：条件　绿：完成</text>
</g></svg>
