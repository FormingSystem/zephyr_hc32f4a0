<rect x="592" y="162" width="144" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
<text x="664.0" y="189.5" text-anchor="middle" font-weight="700">0 → 继续</text>
<rect x="24" y="213" width="136" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
