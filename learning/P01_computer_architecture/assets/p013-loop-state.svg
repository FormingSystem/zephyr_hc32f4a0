<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img"><title>三个采样字节在循环中的寄存器现场</title><desc>原创教学关系图；颜色与箭头含义见本图图例和正文，不代表物理布局或实测周期。</desc><defs>
<marker id="a1469aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#1469aa"/></marker>
<marker id="a7944ad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#7944ad"/></marker>
<marker id="a22764a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#22764a"/></marker>
<marker id="aae5711" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#ae5711"/></marker>
<marker id="a607181" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#607181"/></marker>
</defs>
<rect width="760" height="460" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#203347">
<text x="380" y="27" text-anchor="middle" font-weight="700">RAM：0x20000000 起三个字节为 10、20、30；输入 count=3</text>
<rect x="24" y="48" width="136" height="48" rx="6" fill="#eaf3ff" stroke="#1469aa" stroke-width="1.5"/>
<text x="92.0" y="78.0" text-anchor="middle" font-weight="700">完成位置</text>
<rect x="166" y="48" width="198" height="48" rx="6" fill="#eaf3ff" stroke="#1469aa" stroke-width="1.5"/>
<text x="265.0" y="78.0" text-anchor="middle" font-weight="700">r0：下一地址</text>
<rect x="370" y="48" width="100" height="48" rx="6" fill="#eaf3ff" stroke="#1469aa" stroke-width="1.5"/>
<text x="420.0" y="78.0" text-anchor="middle" font-weight="700">r1：剩余数</text>
<rect x="476" y="48" width="110" height="48" rx="6" fill="#eaf3ff" stroke="#1469aa" stroke-width="1.5"/>
<text x="531.0" y="78.0" text-anchor="middle" font-weight="700">r2：累计和</text>
<rect x="592" y="48" width="144" height="48" rx="6" fill="#f3edfa" stroke="#7944ad" stroke-width="1.5"/>
<text x="664.0" y="78.0" text-anchor="middle" font-weight="700">Z：最近 SUBS</text>
<rect x="24" y="111" width="136" height="43" rx="6" fill="#f3f5f7" stroke="#607181" stroke-width="1.5"/>
