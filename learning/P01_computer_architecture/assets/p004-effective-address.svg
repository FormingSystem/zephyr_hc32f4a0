<svg xmlns="http://www.w3.org/2000/svg" width="760" height="425" viewBox="0 0 760 425" role="img" aria-labelledby="title desc">
<title id="title">有效地址由基址和缩放后的索引形成</title>
<desc id="desc">有效地址由基址和缩放后的索引形成。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="25" y="35" width="230" height="65" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="140.0" y="61.5" text-anchor="middle" font-weight="700">基址 r0</text>
<text x="140.0" y="85.5" text-anchor="middle">0x24000000</text>
<rect x="25" y="155" width="230" height="65" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="140.0" y="181.5" text-anchor="middle" font-weight="700">索引 r2 = 2</text>
<text x="140.0" y="205.5" text-anchor="middle">元素大小 = 4 字节</text>
<rect x="320" y="155" width="180" height="65" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="410.0" y="193.5" text-anchor="middle" font-weight="700">字节偏移 = 8</text>
<rect x="320" y="35" width="390" height="65" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="515.0" y="61.5" text-anchor="middle" font-weight="700">有效地址 = 基址 + 偏移</text>
<text x="515.0" y="85.5" text-anchor="middle">0x24000008</text>
<rect x="320" y="295" width="390" height="65" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="515.0" y="321.5" text-anchor="middle" font-weight="700">该位置保存的内容</text>
<text x="515.0" y="345.5" text-anchor="middle">例如 samples[2] = 42</text>
<polyline points="255,68 320,68" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<polyline points="255,187 320,187" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<polyline points="410,155 410,100" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<polyline points="710,68 735,68 735,327 710,327" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<text x="25" y="280" text-anchor="start">先求位置，</text>
<text x="25" y="307" text-anchor="start">再取得那个位置的内容。</text>
<line x1="24" y1="398" x2="48" y2="398" stroke="#1769aa"/>
<text x="54" y="403" text-anchor="start">计算用数值</text>
<line x1="156" y1="398" x2="180" y2="398" stroke="#7540a0"/>
<text x="186" y="403" text-anchor="start">有效地址</text>
<line x1="272" y1="398" x2="296" y2="398" stroke="#217346"/>
<text x="302" y="403" text-anchor="start">对象内容</text>
</g></svg>