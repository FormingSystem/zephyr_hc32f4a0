<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img"><title>程序镜像与运行时对象</title><desc>左侧Flash保存指令和初始值，右侧RAM分别安排静态对象、堆和调用栈，CPU执行初始化与分配操作。</desc><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9333ea"/></marker></defs><rect width="760" height="570" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#172b4d"><rect x="24" y="22" width="284" height="420" rx="7" fill="#f5f3ff" stroke="#9333ea" stroke-width="1.5"/><text x="40" y="50" fill="#172b4d">Flash：掉电保留的镜像</text><rect x="42" y="78" width="248" height="80" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="103" fill="#172b4d">text：函数机器指令</text><text x="54" y="127" fill="#172b4d">CPU从这里取指</text><rect x="42" y="200" width="248" height="80" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="225" fill="#172b4d">data初始值副本</text><text x="54" y="249" fill="#172b4d">例如 threshold = 25</text><rect x="42" y="330" width="248" height="80" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="355" fill="#172b4d">链接布局与启动代码</text><text x="54" y="379" fill="#172b4d">给出源、目的与区间边界</text><rect x="432" y="22" width="304" height="420" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="448" y="50" fill="#172b4d">RAM：运行时布局（非比例）</text><rect x="450" y="78" width="268" height="64" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="462" y="103" fill="#172b4d">data：可修改的静态对象</text><rect x="450" y="162" width="268" height="64" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="462" y="187" fill="#172b4d">bss：启动时清零的对象</text><rect x="450" y="246" width="268" height="64" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="462" y="271" fill="#172b4d">堆：分配器管理的块</text><rect x="450" y="330" width="268" height="84" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="462" y="355" fill="#172b4d">栈：调用信息与临时保存</text><text x="462" y="379" fill="#172b4d">SP随压栈 / 恢复而变化</text><path d="M290 230H354V110H450" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#b)"/><text x="316" y="96" fill="#172b4d">复制初值</text><path d="M290 360H390V194H450" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#p)"/><text x="318" y="181" fill="#9333ea">清零区间</text><text x="24" y="477" fill="#172b4d">CPU 执行 malloc / free 管理堆；函数调用按需使用寄存器和栈。</text><text x="24" y="506" fill="#172b4d">蓝线：初始值搬运；紫色虚线：启动代码按布局执行清零。</text><text x="24" y="535" fill="#172b4d">图中区间由工程安排；栈与堆不是两种不同的物理 RAM。</text></g></svg>