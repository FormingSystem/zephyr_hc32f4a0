<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">每个字节都有地址，四字节组成一个小端数</title>
<desc id="desc">每个字节都有地址，四字节组成一个小端数。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<text x="25" y="35" text-anchor="start" font-weight="700">连续字节地址</text>
<text x="105" y="80" text-anchor="middle">0x20000000</text>
<rect x="25" y="100" width="160" height="60" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="105.0" y="136.0" text-anchor="middle" font-weight="700">0x78</text>
<text x="285" y="80" text-anchor="middle">0x20000001</text>
<rect x="205" y="100" width="160" height="60" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="285.0" y="136.0" text-anchor="middle" font-weight="700">0x56</text>
<text x="465" y="80" text-anchor="middle">0x20000002</text>
<rect x="385" y="100" width="160" height="60" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="465.0" y="136.0" text-anchor="middle" font-weight="700">0x34</text>
<text x="645" y="80" text-anchor="middle">0x20000003</text>
<rect x="565" y="100" width="160" height="60" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="645.0" y="136.0" text-anchor="middle" font-weight="700">0x12</text>
<rect x="195" y="240" width="370" height="55" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="380.0" y="273.5" text-anchor="middle" font-weight="700">按 32 位小端解释：0x12345678</text>
<polyline points="25,182 25,205 380,205 380,240" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<text x="42" y="197" text-anchor="start" fill="#7540a0">从 ...00 开始，宽度 4 字节</text>
<line x1="24" y1="323" x2="48" y2="323" stroke="#1769aa"/>
<text x="54" y="328" text-anchor="start">一个字节</text>
<line x1="140" y1="323" x2="164" y2="323" stroke="#7540a0"/>
<text x="170" y="328" text-anchor="start">起点/范围</text>
<line x1="272" y1="323" x2="296" y2="323" stroke="#217346"/>
<text x="302" y="328" text-anchor="start">解释结果</text>
</g></svg>