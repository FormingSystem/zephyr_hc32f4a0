<svg xmlns="http://www.w3.org/2000/svg" width="800" height="438" viewBox="0 0 800 438" role="img" aria-labelledby="title desc">
  <title id="title">同一条交叉编译命令中的主机、目标和输出</title>
  <desc id="desc">UCRT64 或 Linux Bash · 练习目录中已有 instructions.c 和 build/。电脑执行 arm-none-eabi-gcc，-mcpu 等参数决定它生成哪种代码。-c 让这次命令停在目标文件；H743 启动还需要已链接并装载到正确位置的镜像。</desc>
  <rect width="800" height="438" fill="#ffffff"/>
  <path d="M400 138 V155 M137.333 155 H662.667" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 155 V176" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 222 V239" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M137.333 285 V302" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M400 155 V176" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M400 222 V239" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M400 333 V350" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M662.667 155 V176" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M662.667 222 V239" fill="none" stroke="#207767" stroke-width="2"/>
  <path d="M662.667 309 V326" fill="none" stroke="#207767" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="126" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">UCRT64 或 Linux Bash · 练习目录中已有 instructions.c 和 build/</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">arm-none-eabi-gcc -mcpu=cortex-m7 -mthumb -mfloat-abi=soft \</text>
  <text x="400" y="90" font-size="17" font-weight="700" fill="#172d3e">-O1 -g3 -Wall -Wextra -ffreestanding \</text>
  <text x="400" y="116" font-size="17" font-weight="700" fill="#172d3e">-c instructions.c -o build/instructions.o</text>
  <rect x="14" y="176" width="246.667" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="137.333" y="204" font-size="17" font-weight="700" fill="#25618b">主机上的程序</text>
  <rect x="14" y="239" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="267" font-size="16" font-weight="400" fill="#182e3d">arm-none-eabi-gcc</text>
  <rect x="14" y="302" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="330" font-size="16" font-weight="400" fill="#182e3d">Windows 或 Linux 运行本机</text>
  <text x="137.333" y="354" font-size="16" font-weight="400" fill="#182e3d">版本的 GCC</text>
  <rect x="276.667" y="176" width="246.667" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="400" y="204" font-size="17" font-weight="700" fill="#705197">目标机器的约定</text>
  <rect x="276.667" y="239" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="267" font-size="16" font-weight="400" fill="#182e3d">-mcpu=cortex-m7</text>
  <text x="400" y="291" font-size="16" font-weight="400" fill="#182e3d">-mthumb</text>
  <text x="400" y="315" font-size="16" font-weight="400" fill="#182e3d">-mfloat-abi=soft</text>
  <rect x="276.667" y="350" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="378" font-size="16" font-weight="400" fill="#182e3d">按 Cortex-M7 指令与软件浮点</text>
  <text x="400" y="402" font-size="16" font-weight="400" fill="#182e3d">调用约定生成代码</text>
  <rect x="539.333" y="176" width="246.667" height="46" rx="8" fill="#e9f6f2" stroke="#207767" stroke-width="1.5"/>
  <text x="662.667" y="204" font-size="17" font-weight="700" fill="#207767">输入与产物</text>
  <rect x="539.333" y="239" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="267" font-size="16" font-weight="400" fill="#182e3d">-c instructions.c</text>
  <text x="662.667" y="291" font-size="16" font-weight="400" fill="#182e3d">-o build/instructions.o</text>
  <rect x="539.333" y="326" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="354" font-size="16" font-weight="400" fill="#182e3d">目标文件交给链接器，与启动</text>
  <text x="662.667" y="378" font-size="16" font-weight="400" fill="#182e3d">代码一起按 H743 的内存布局</text>
  <text x="662.667" y="402" font-size="16" font-weight="400" fill="#182e3d">生成镜像</text>
  </g>
</svg>
