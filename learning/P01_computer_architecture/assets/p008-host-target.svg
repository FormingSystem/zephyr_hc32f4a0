<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345" role="img" aria-labelledby="title desc">
<title id="title">电脑上的工具与芯片上运行的代码</title>
<desc id="desc">电脑上的工具与芯片上运行的代码。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="25" y="35" width="310" height="85" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="180.0" y="71.5" text-anchor="middle" font-weight="700">主机：Windows x64 / Linux</text>
<text x="180.0" y="95.5" text-anchor="middle">运行对应主机版本的编译工具</text>
<rect x="425" y="35" width="310" height="85" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="580.0" y="71.5" text-anchor="middle" font-weight="700">目标：Cortex-M7 / H743</text>
<text x="580.0" y="95.5" text-anchor="middle">执行支持的 Thumb 机器码</text>
<rect x="25" y="210" width="310" height="65" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="180.0" y="236.5" text-anchor="middle" font-weight="700">C 源码 + 目标选项</text>
<text x="180.0" y="260.5" text-anchor="middle">生成 .o，再完成链接</text>
<rect x="425" y="210" width="310" height="65" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="580.0" y="236.5" text-anchor="middle" font-weight="700">固件镜像 + 正确装载位置</text>
<text x="580.0" y="260.5" text-anchor="middle">满足启动和板级条件</text>
<polyline points="180,120 180,210" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<polyline points="335,242 425,242" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<polyline points="580,210 580,120" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<line x1="24" y1="318" x2="48" y2="318" stroke="#1769aa"/>
<text x="54" y="323" text-anchor="start">主机执行</text>
<line x1="140" y1="318" x2="164" y2="318" stroke="#b45b13"/>
<text x="170" y="323" text-anchor="start">构建输入</text>
<line x1="256" y1="318" x2="280" y2="318" stroke="#7540a0"/>
<text x="286" y="323" text-anchor="start">交付</text>
<line x1="340" y1="318" x2="364" y2="318" stroke="#217346"/>
<text x="370" y="323" text-anchor="start">目标运行</text>
</g></svg>