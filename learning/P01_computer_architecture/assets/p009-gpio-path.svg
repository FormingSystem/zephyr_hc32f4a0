<svg xmlns="http://www.w3.org/2000/svg" width="760" height="485" viewBox="0 0 760 485" role="img" aria-labelledby="title desc">
<title id="title">按钮输入经过 GPIO 寄存器与 CPU 再控制输出</title>
<desc id="desc">按钮输入经过 GPIO 寄存器与 CPU 再控制输出。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="20" y="30" width="250" height="65" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="145.0" y="56.5" text-anchor="middle" font-weight="700">先配置 RCC 与 GPIO 模式</text>
<text x="145.0" y="80.5" text-anchor="middle">使能时钟、输入上拉、输出</text>
<rect x="20" y="160" width="165" height="65" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="102.5" y="186.5" text-anchor="middle" font-weight="700">PC13 按钮</text>
<text x="102.5" y="210.5" text-anchor="middle">按下为低电平</text>
<rect x="245" y="145" width="230" height="95" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="360.0" y="174.5" text-anchor="middle" font-weight="700">GPIOC_IDR 位 13</text>
<text x="360.0" y="198.5" text-anchor="middle">地址 0x58020810</text>
<text x="360.0" y="222.5" text-anchor="middle">本次状态 = 0</text>
<rect x="545" y="145" width="195" height="95" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="642.5" y="174.5" text-anchor="middle" font-weight="700">CPU 读取并判断</text>
<text x="642.5" y="198.5" text-anchor="middle">位 13 为 0</text>
<text x="642.5" y="222.5" text-anchor="middle">准备写值 1</text>
<rect x="245" y="320" width="230" height="85" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="360.0" y="344.5" text-anchor="middle" font-weight="700">GPIOB_BSRR 位 0</text>
<text x="360.0" y="368.5" text-anchor="middle">地址 0x58020418</text>
<text x="360.0" y="392.5" text-anchor="middle">写 1：置位 PB0</text>
<rect x="20" y="320" width="165" height="85" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="102.5" y="344.5" text-anchor="middle" font-weight="700">PB0 输出高</text>
<text x="102.5" y="368.5" text-anchor="middle">外部限流/驱动</text>
<text x="102.5" y="392.5" text-anchor="middle">LED 亮</text>
<polyline points="185,192 245,192" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<polyline points="475,192 545,192" fill="none" stroke="#1769aa" stroke-width="2" marker-end="url(#blue)"/>
<polyline points="642,240 642,362 475,362" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<text x="570" y="310" text-anchor="start" fill="#217346">CPU 写出</text>
<polyline points="245,362 185,362" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<polyline points="270,65 360,65 360,145" fill="none" stroke="#7540a0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#purple)"/>
<text x="25" y="440" text-anchor="start">松开时位 13 为 1 → CPU 写 BSRR 位 16 → PB0 复位为低。</text>
<line x1="24" y1="458" x2="48" y2="458" stroke="#1769aa"/>
<text x="54" y="463" text-anchor="start">输入/状态</text>
<line x1="156" y1="458" x2="180" y2="458" stroke="#b45b13"/>
<text x="186" y="463" text-anchor="start">CPU 处理</text>
<line x1="304" y1="458" x2="328" y2="458" stroke="#217346"/>
<text x="334" y="463" text-anchor="start">输出</text>
<line x1="388" y1="458" x2="412" y2="458" stroke="#7540a0"/>
<text x="418" y="463" text-anchor="start">配置前提</text>
</g></svg>