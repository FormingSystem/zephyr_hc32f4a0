<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">实际 H743 MDK 工程的复位到应用链</title>
<desc id="desc">实际 H743 MDK 工程的复位到应用链。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="25" y="25" width="310" height="85" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="180.0" y="61.5" text-anchor="middle" font-weight="700">复位与向量读取</text>
<text x="180.0" y="85.5" text-anchor="middle">进入 Reset_Handler</text>
<rect x="425" y="25" width="310" height="85" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="580.0" y="61.5" text-anchor="middle" font-weight="700">ExitRun0Mode</text>
<text x="580.0" y="85.5" text-anchor="middle">按供电配置建立条件</text>
<rect x="425" y="185" width="310" height="85" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="580.0" y="221.5" text-anchor="middle" font-weight="700">SystemInit</text>
<text x="580.0" y="245.5" text-anchor="middle">核心 / 系统初始设置</text>
<rect x="25" y="185" width="310" height="85" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="180.0" y="221.5" text-anchor="middle" font-weight="700">运行库 __main</text>
<text x="180.0" y="245.5" text-anchor="middle">数据初始化与运行库准备</text>
<rect x="25" y="365" width="310" height="85" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="180.0" y="401.5" text-anchor="middle" font-weight="700">应用 main</text>
<text x="180.0" y="425.5" text-anchor="middle">HAL_Init / SystemClock_Config</text>
<polyline points="335,67 425,67" fill="none" stroke="#b45b13" stroke-width="2" marker-end="url(#orange)"/>
<polyline points="580,110 580,185" fill="none" stroke="#b45b13" stroke-width="2" marker-end="url(#orange)"/>
<polyline points="425,227 335,227" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<polyline points="180,270 180,365" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<text x="425" y="360" text-anchor="start">来源：已核对的 MDK 工程</text>
<text x="425" y="389" text-anchor="start">不同工具链的启动实现不同。</text>
<text x="25" y="499" text-anchor="start">__main 是 Arm 运行库入口；main 才是应用函数。</text>
<line x1="24" y1="533" x2="48" y2="533" stroke="#1769aa"/>
<text x="54" y="538" text-anchor="start">硬件启动</text>
<line x1="140" y1="533" x2="164" y2="533" stroke="#b45b13"/>
<text x="170" y="538" text-anchor="start">芯片准备</text>
<line x1="256" y1="533" x2="280" y2="533" stroke="#7540a0"/>
<text x="286" y="538" text-anchor="start">运行库</text>
<line x1="356" y1="533" x2="380" y2="533" stroke="#217346"/>
<text x="386" y="538" text-anchor="start">应用</text>
</g></svg>