<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
<title id="title">按钮与测量事件驱动的单核线程调度</title>
<desc id="desc">按钮与测量事件驱动的单核线程调度。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<text x="20" y="76" text-anchor="start">唯一 CPU</text>
<rect x="145" y="50" width="580" height="36" rx="0" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<rect x="145.0" y="50" width="145.0" height="36" fill="#1769aa"/>
<rect x="290.0" y="50" width="14.500000000000012" height="36" fill="#7540a0"/>
<rect x="304.5" y="50" width="14.49999999999998" height="36" fill="#217346"/>
<rect x="319.0" y="50" width="116.0" height="36" fill="#1769aa"/>
<rect x="435.0" y="50" width="14.500000000000012" height="36" fill="#7540a0"/>
<rect x="449.5" y="50" width="28.99999999999996" height="36" fill="#b45b13"/>
<rect x="478.5" y="50" width="174.00000000000003" height="36" fill="#1769aa"/>
<text x="20" y="141" text-anchor="start">显示线程</text>
<rect x="145" y="115" width="580" height="36" rx="0" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<rect x="145.0" y="115" width="145.0" height="36" fill="#1769aa"/>
<rect x="319.0" y="115" width="116.0" height="36" fill="#1769aa"/>
<rect x="478.5" y="115" width="174.00000000000003" height="36" fill="#1769aa"/>
<text x="20" y="206" text-anchor="start">按钮线程</text>
<rect x="145" y="180" width="580" height="36" rx="0" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<rect x="304.5" y="180" width="14.49999999999998" height="36" fill="#217346"/>
<text x="20" y="271" text-anchor="start">测量线程</text>
<rect x="145" y="245" width="580" height="36" rx="0" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<rect x="449.5" y="245" width="28.99999999999996" height="36" fill="#b45b13"/>
<text x="688.75" y="76" text-anchor="middle">空闲</text>
<text x="688.75" y="141" text-anchor="middle">阻塞</text>
<text x="217.5" y="206" text-anchor="middle">阻塞</text>
<text x="522.0" y="206" text-anchor="middle">处理完立即阻塞</text>
<text x="290.0" y="271" text-anchor="middle">阻塞等待新数据</text>
<text x="601.75" y="271" text-anchor="middle">处理完立即阻塞</text>
<line x1="145.0" y1="301" x2="145.0" y2="307" stroke="#667080"/>
<text x="145.0" y="330" text-anchor="middle">0</text>
<line x1="290.0" y1="301" x2="290.0" y2="307" stroke="#667080"/>
<text x="290.0" y="330" text-anchor="middle">1</text>
<line x1="435.0" y1="301" x2="435.0" y2="307" stroke="#667080"/>
<text x="435.0" y="330" text-anchor="middle">2</text>
<line x1="580.0" y1="301" x2="580.0" y2="307" stroke="#667080"/>
<text x="580.0" y="330" text-anchor="middle">3</text>
<line x1="725.0" y1="301" x2="725.0" y2="307" stroke="#667080"/>
<text x="725.0" y="330" text-anchor="middle">4</text>
<text x="24" y="372" text-anchor="start">时间 / ms（教学假设）；刻度不代表 tick 或强制切换点。</text>
<text x="24" y="399" text-anchor="start">蓝：显示；绿：按钮；橙：测量；紫：ISR / 调度开销。</text>
<text x="24" y="426" text-anchor="start">浅灰：本事务未执行。按钮、测量无事件时阻塞；显示被抢占时就绪。</text>
<text x="24" y="453" text-anchor="start">按钮处理 0.1 ms、测量 0.2 ms 后立即阻塞；3.5 ms 后 CPU 空闲。</text>
<text x="24" y="480" text-anchor="start">未展开周期计时中断、浮点与其他开销；显示有效计算共 3 ms。</text>
</g></svg>
