<svg xmlns="http://www.w3.org/2000/svg" width="800" height="377" viewBox="0 0 800 377" role="img" aria-labelledby="title desc">
  <title id="title">复位时，向量表的前两个字分别写到哪里</title>
  <desc id="desc">教学镜像 · 启动选择已指向用户 Flash。同一基址下的两个字有不同用途。把第二项的最低位与入口地址分开读，就能从镜像里的 0x08000299 找到实际取指位置。</desc>
  <rect width="800" height="377" fill="#ffffff"/>
  <path d="M400 86 V103 M203 103 H597" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M203 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M203 170 V187" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M203 233 V250" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M203 296 V313" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M597 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M597 170 V187" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M597 233 V250" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M597 296 V313" fill="none" stroke="#705197" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="74" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">教学镜像 · 启动选择已指向用户 Flash</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">向量表基址  0x08000000</text>
  <rect x="14" y="124" width="378" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="203" y="152" font-size="17" font-weight="700" fill="#25618b">第 0 项 · 偏移 0</text>
  <rect x="14" y="187" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="215" font-size="16" font-weight="400" fill="#182e3d">0x08000000 存放 0x20020000</text>
  <rect x="14" y="250" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="278" font-size="16" font-weight="400" fill="#182e3d">硬件装入 MSP</text>
  <rect x="14" y="313" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="341" font-size="16" font-weight="400" fill="#182e3d">初始栈顶为 0x20020000，栈向低地址增长</text>
  <rect x="408" y="124" width="378" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="597" y="152" font-size="17" font-weight="700" fill="#705197">第 1 项 · 偏移 4</text>
  <rect x="408" y="187" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="597" y="215" font-size="16" font-weight="400" fill="#182e3d">0x08000004 存放 0x08000299</text>
  <rect x="408" y="250" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="597" y="278" font-size="16" font-weight="400" fill="#182e3d">位 0 指示 Thumb 状态</text>
  <rect x="408" y="313" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="597" y="341" font-size="16" font-weight="400" fill="#182e3d">处理器从 0x08000298 取复位入口的第一条指令</text>
  </g>
</svg>
