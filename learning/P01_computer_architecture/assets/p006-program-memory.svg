<svg xmlns="http://www.w3.org/2000/svg" width="760" height="605" viewBox="0 0 760 605" role="img" aria-labelledby="title desc">
<title id="title">程序段栈堆映射到 Flash RAM 与 CPU 寄存器</title>
<desc id="desc">程序段栈堆映射到 Flash RAM 与 CPU 寄存器。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="20" y="30" width="280" height="340" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="40" y="60" text-anchor="start" font-weight="700">Flash：保存镜像</text>
<rect x="40" y="85" width="240" height="60" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="160.0" y="109.0" text-anchor="middle" font-weight="700">.text：指令</text>
<text x="160.0" y="133.0" text-anchor="middle">.rodata：只读内容</text>
<rect x="40" y="220" width="240" height="70" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="160.0" y="249.0" text-anchor="middle" font-weight="700">.data 的初始内容</text>
<text x="160.0" y="273.0" text-anchor="middle">例如 scale 的初值 10</text>
<rect x="420" y="30" width="320" height="465" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="440" y="60" text-anchor="start" font-weight="700">RAM：运行期布局</text>
<rect x="440" y="80" width="280" height="60" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="580.0" y="104.0" text-anchor="middle" font-weight="700">.data：可写初始值</text>
<text x="580.0" y="128.0" text-anchor="middle">scale 的运行值从 10 开始</text>
<rect x="440" y="155" width="280" height="60" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="580.0" y="179.0" text-anchor="middle" font-weight="700">.bss：启动代码写零</text>
<text x="580.0" y="203.0" text-anchor="middle">report_count 从 0 开始</text>
<rect x="440" y="235" width="280" height="65" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="580.0" y="261.5" text-anchor="middle" font-weight="700">堆：按分配器规则持有</text>
<text x="580.0" y="285.5" text-anchor="middle">可能不用动态分配</text>
<rect x="440" y="320" width="280" height="65" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="580.0" y="346.5" text-anchor="middle" font-weight="700">栈：调用状态与局部空间</text>
<text x="580.0" y="370.5" text-anchor="middle">各区域边界由工程配置</text>
<rect x="440" y="405" width="280" height="65" rx="8" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<text x="580.0" y="443.5" text-anchor="middle" font-weight="700">其他缓冲 / 保留 / 未用区</text>
<polyline points="280,255 355,255 355,112 440,112" fill="none" stroke="#b45b13" stroke-width="2" marker-end="url(#orange)"/>
<text x="315" y="300" text-anchor="middle" fill="#b45b13">启动复制</text>
<rect x="20" y="450" width="280" height="60" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="160.0" y="474.0" text-anchor="middle" font-weight="700">CPU 寄存器 SP</text>
<text x="160.0" y="498.0" text-anchor="middle">保存当前栈地址</text>
<polyline points="300,480 395,480 395,352 440,352" fill="none" stroke="#7540a0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#purple)"/>
<line x1="24" y1="578" x2="48" y2="578" stroke="#1769aa"/>
<text x="54" y="583" text-anchor="start">只读镜像</text>
<line x1="140" y1="578" x2="164" y2="578" stroke="#b45b13"/>
<text x="170" y="583" text-anchor="start">初始化</text>
<line x1="240" y1="578" x2="264" y2="578" stroke="#217346"/>
<text x="270" y="583" text-anchor="start">可写空间</text>
<line x1="356" y1="578" x2="380" y2="578" stroke="#7540a0"/>
<text x="386" y="583" text-anchor="start">地址引用</text>
</g></svg>