<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img"><title>H743系统访问路径</title><desc>保留D1与D2相关角色，区分CPU紧耦合接口、缓存路径、DMA主设备与目标；省略D3及其他连接。</desc><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#9333ea"/></marker></defs><rect width="760" height="570" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#172b4d"><rect x="20" y="20" width="720" height="274" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="36" y="48" fill="#172b4d">D1 域相关路径：CPU 与高带宽存储（简化）</text><rect x="42" y="77" width="170" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="102" fill="#172b4d">Cortex-M7</text><text x="54" y="126" fill="#172b4d">当前执行指令</text><rect x="292" y="77" width="174" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="304" y="102" fill="#172b4d">ITCM / DTCM</text><text x="304" y="126" fill="#172b4d">核侧紧耦合存储</text><path d="M212 109H292" fill="none" stroke="#2563eb" stroke-width="2"  marker-start="url(#b)" marker-end="url(#b)"/><text x="216" y="96" fill="#172b4d">核侧接口</text><rect x="42" y="196" width="170" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="221" fill="#172b4d">指令 / 数据缓存</text><path d="M127 143V196" fill="none" stroke="#2563eb" stroke-width="2"  marker-start="url(#b)" marker-end="url(#b)"/><rect x="292" y="196" width="174" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="304" y="221" fill="#172b4d">AXI互连</text><path d="M212 229H292" fill="none" stroke="#2563eb" stroke-width="2"  marker-start="url(#b)" marker-end="url(#b)"/><text x="216" y="216" fill="#172b4d">访问</text><rect x="548" y="196" width="166" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="560" y="221" fill="#172b4d">AXI SRAM</text><path d="M466 229H548" fill="none" stroke="#2563eb" stroke-width="2"  marker-start="url(#b)" marker-end="url(#b)"/><text x="480" y="216" fill="#172b4d">读写</text><rect x="20" y="335" width="720" height="150" rx="7" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="36" y="362" fill="#172b4d">D2 域相关路径：部分 DMA 与外设</text><rect x="42" y="391" width="170" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="416" fill="#172b4d">DMA1 / DMA2</text><text x="54" y="440" fill="#172b4d">独立发起访问</text><rect x="292" y="391" width="174" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="304" y="416" fill="#172b4d">AHB互连与桥</text><rect x="548" y="391" width="166" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="560" y="416" fill="#172b4d">串行外设等目标</text><path d="M212 424H292" fill="none" stroke="#2563eb" stroke-width="2"  marker-start="url(#b)" marker-end="url(#b)"/><path d="M466 424H548" fill="none" stroke="#2563eb" stroke-width="2"  marker-start="url(#b)" marker-end="url(#b)"/><path d="M380 262V391" fill="none" stroke="#2563eb" stroke-width="2"  marker-start="url(#b)" marker-end="url(#b)"/><text x="394" y="318" fill="#172b4d">跨域桥：核对发起者到目标的可达性</text><text x="24" y="518" fill="#172b4d">蓝色实线：选取的逻辑访问路径，不表示完整互连或固定传输延迟。</text><text x="24" y="546" fill="#172b4d">RCC 分别控制相关时钟与复位；省略 D3、其他主设备及目标。</text></g></svg>