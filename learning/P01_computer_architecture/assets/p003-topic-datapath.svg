<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img"><title>CPU数据与控制通路</title><desc>分别显示指令选择、寄存器、计算、加载存储和写回；不是逐周期流水线图。</desc><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9333ea"/></marker></defs><rect width="760" height="600" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#172b4d"><rect x="18" y="18" width="724" height="524" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="34" y="45" fill="#172b4d">CPU 核心边界：一份当前架构状态，多个内部执行部件</text><rect x="40" y="70" width="180" height="76" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="52" y="95" fill="#172b4d">PC：执行位置</text><text x="52" y="119" fill="#172b4d">指令取回与缓冲</text><rect x="290" y="70" width="190" height="76" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="302" y="95" fill="#172b4d">译码与控制</text><text x="302" y="119" fill="#172b4d">识别操作数和动作</text><path d="M220 108H290" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#b)"/><text x="226" y="95" fill="#172b4d">指令</text><rect x="550" y="70" width="165" height="76" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="562" y="95" fill="#172b4d">APSR</text><text x="562" y="119" fill="#172b4d">条件标志</text><path d="M632 70V55H130V70" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#p)"/><rect x="40" y="210" width="210" height="100" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="52" y="235" fill="#172b4d">通用寄存器组</text><text x="52" y="259" fill="#172b4d">r0：源地址</text><text x="52" y="283" fill="#172b4d">r1：数值 / r2：目的地址</text><rect x="310" y="210" width="170" height="100" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="322" y="235" fill="#172b4d">ALU与地址生成</text><text x="322" y="259" fill="#172b4d">加偏移 / 加数</text><text x="322" y="283" fill="#172b4d">形成有效地址</text><rect x="550" y="210" width="165" height="100" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="562" y="235" fill="#172b4d">加载与存储单元</text><text x="562" y="259" fill="#172b4d">按宽度读写</text><text x="562" y="283" fill="#172b4d">接收数据或发送</text><path d="M250 258H310" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#b)"/><path d="M480 258H550" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#b)"/><text x="486" y="244" fill="#172b4d">地址</text><path d="M345 146V178H145V210" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#p)"/><text x="160" y="172" fill="#9333ea">选择源寄存器</text><path d="M420 146V210" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#p)"/><text x="430" y="185" fill="#9333ea">动作</text><path d="M480 230H514V176H632V146" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#b)"/><text x="520" y="167" fill="#172b4d">状态更新</text><rect x="40" y="390" width="210" height="80" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="52" y="415" fill="#172b4d">写回目标寄存器</text><text x="52" y="439" fill="#172b4d">加载结果或运算结果</text><rect x="550" y="390" width="165" height="80" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="562" y="415" fill="#172b4d">数据接口</text><text x="562" y="439" fill="#172b4d">RAM / 外设路径</text><path d="M633 310V390" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#b)"/><text x="643" y="348" fill="#172b4d">地址 / 宽度</text><path d="M570 390V336H145V390" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#b)"/><text x="270" y="330" fill="#172b4d">加载数据返回：写回 r1</text><path d="M350 310V360H250V420" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#b)"/><text x="276" y="383" fill="#172b4d">运算结果</text><path d="M85 390V310" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#b)"/><text x="95" y="355" fill="#172b4d">更新</text><text x="40" y="508" fill="#172b4d">例：LDR r1,[r0] → ADDS r1,r1,#4 → STR r1,[r2]</text><text x="24" y="568" fill="#172b4d">蓝色实线：指令、地址或数值；紫色虚线：控制选择与分支条件。</text><path d="M250 290H270V486H732V286H715" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/><text x="320" y="479">STR：r1的数据送往存储单元</text></g></svg>