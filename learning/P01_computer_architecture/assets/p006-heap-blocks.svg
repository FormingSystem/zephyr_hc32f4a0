<svg xmlns="http://www.w3.org/2000/svg" width="760" height="425" viewBox="0 0 760 425" role="img" aria-labelledby="title desc">
<title id="title">64 字节简化堆中的分配释放与碎片</title>
<desc id="desc">64 字节简化堆中的分配释放与碎片。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<text x="25" y="35" text-anchor="start" font-weight="700">① 分配 16 字节，再分配 24 字节</text>
<rect x="25" y="65" width="176" height="65" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="113.0" y="103.5" text-anchor="middle" font-weight="700">像素：16</text>
<rect x="201" y="65" width="264" height="65" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="333.0" y="103.5" text-anchor="middle" font-weight="700">发送描述：24</text>
<rect x="465" y="65" width="264" height="65" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="597.0" y="103.5" text-anchor="middle" font-weight="700">空闲：24</text>
<text x="25" y="195" text-anchor="start" font-weight="700">② 释放像素块；发送描述仍被持有</text>
<rect x="25" y="225" width="176" height="65" rx="8" fill="#eef0f3" stroke="#667080" stroke-width="1.5"/>
<text x="113.0" y="263.5" text-anchor="middle" font-weight="700">已释放：16</text>
<rect x="201" y="225" width="264" height="65" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="333.0" y="263.5" text-anchor="middle" font-weight="700">仍占用：24</text>
<rect x="465" y="225" width="264" height="65" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="597.0" y="263.5" text-anchor="middle" font-weight="700">空闲：24</text>
<text x="25" y="345" text-anchor="start">总空闲 40，但最大连续块为 24；连续 32 字节请求可能失败。</text>
<line x1="24" y1="398" x2="48" y2="398" stroke="#1769aa"/>
<text x="54" y="403" text-anchor="start">持有块</text>
<line x1="124" y1="398" x2="148" y2="398" stroke="#b45b13"/>
<text x="154" y="403" text-anchor="start">持有块</text>
<line x1="224" y1="398" x2="248" y2="398" stroke="#217346"/>
<text x="254" y="403" text-anchor="start">空闲</text>
<line x1="308" y1="398" x2="332" y2="398" stroke="#667080"/>
<text x="338" y="403" text-anchor="start">已释放</text>
</g></svg>