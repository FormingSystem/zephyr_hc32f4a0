<svg xmlns="http://www.w3.org/2000/svg" width="800" height="704" viewBox="0 0 800 704" role="img" aria-labelledby="title desc">
<title id="title">恢复键盘线程：找回它自己的 TCB 与栈</title><desc id="desc">同一单核 CPU 在显示提交线程与键盘处理线程之间切换。每个线程有独立 k_thread 和栈。Zephyr Cortex-M 基本现场：硬件异常帧在栈中，r4-r11 与 PSP 在 TCB 中。省略浮点和保护状态。</desc>
<defs>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
<marker id="save" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b95309"/></marker>
<marker id="restore" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#15804a"/></marker>
<marker id="pointer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
</defs>
<rect width="800" height="704" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243447">
<text x="20" y="30" font-size="16" fill="#243447" font-weight="600" text-anchor="start">恢复键盘线程：找回它自己的 TCB 与栈</text>
<rect x="20" y="62" width="360" height="40" rx="6" fill="#fff4df" stroke="#94a3b8" stroke-width="1.3"/>
<text x="200.0" y="88.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">显示线程：就绪，等待继续</text>
<rect x="420" y="62" width="360" height="40" rx="6" fill="#e7f5ed" stroke="#94a3b8" stroke-width="1.3"/>
<text x="600.0" y="88.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">键盘线程：取报告，更新输入状态</text>
<rect x="20" y="126" width="170" height="60" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="105.0" y="151.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">显示驱动</text>
<text x="105.0" y="173.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">配置传输、提交像素</text>
<rect x="230" y="126" width="150" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
<text x="305.0" y="151.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">SPI + DMA</text>
<text x="305.0" y="173.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">向显示屏发送</text>
<path d="M95 102V126" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<path d="M190 156H230" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<text x="20" y="213" font-size="16" fill="#243447" font-weight="400" text-anchor="start">这是后续输出路径；此刻尚未提交传输。</text>
<rect x="420" y="126" width="360" height="36" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="600.0" y="150.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">键盘报告队列 · RAM</text>
<rect x="420" y="186" width="170" height="52" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="505.0" y="207.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">USB HID 接收路径</text>
<text x="505.0" y="229.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">驱动将报告入队</text>
<rect x="628" y="186" width="152" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<text x="704.0" y="207.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">USB 主机控制器</text>
<text x="704.0" y="229.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">已取得键盘报告</text>
<path d="M628 212H590" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<path d="M505 186V162" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<path d="M600 126V102" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<path d="M490 126V102" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<text x="433" y="118" font-size="16" fill="#2563eb">取报告</text>
<text x="619" y="118" font-size="16" fill="#7c3aed" font-weight="400" text-anchor="start">唤醒</text>
<rect x="18" y="268" width="262" height="360" rx="6" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.3"/>
<rect x="520" y="268" width="262" height="360" rx="6" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="28" y="291" font-size="16" fill="#243447" font-weight="600" text-anchor="start">显示现场 · RAM</text>
<text x="530" y="291" font-size="16" fill="#243447" font-weight="600" text-anchor="start">键盘现场 · RAM</text>
<rect x="302" y="278" width="196" height="36" rx="6" fill="#f3edff" stroke="#7c3aed" stroke-width="1.3"/>
<text x="400.0" y="302.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">current → 键盘 TCB</text>
<path d="M498 296H650V316" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<rect x="28" y="316" width="242" height="128" rx="6" fill="#fff4df" stroke="#94a3b8" stroke-width="1.3"/>
<text x="40" y="340" font-size="16" fill="#243447" font-weight="600" text-anchor="start">显示 TCB · k_thread</text>
<text x="40" y="365" font-size="16" fill="#243447" font-weight="400" text-anchor="start">优先级 4 · 就绪</text>
<text x="40" y="389" font-size="16" fill="#243447" font-weight="400" text-anchor="start">r4–r11：本线程保存值</text>
<text x="40" y="413" font-size="16" fill="#243447" font-weight="400" text-anchor="start">psp = D_SP</text>
<path d="M100 444V478" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#pointer)"/>
<text x="114" y="466" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">指向自己的栈</text>
<rect x="28" y="478" width="242" height="136" rx="6" fill="#fff4df" stroke="#94a3b8" stroke-width="1.3"/>
<text x="40" y="501" font-size="16" fill="#243447" font-weight="600" text-anchor="start">显示栈 · D_SP 指向异常帧</text>
<text x="40" y="524" font-size="16" fill="#243447" font-weight="400" text-anchor="start">r0–r3、r12、LR</text>
<text x="40" y="546" font-size="16" fill="#243447" font-weight="400" text-anchor="start">PC：像素准备处；xPSR</text>
<path d="M38 557h222" stroke="#cbd5e1"/>
<text x="40" y="580" font-size="16" fill="#243447" font-weight="400" text-anchor="start">原有函数调用帧</text>
<text x="40" y="602" font-size="16" fill="#243447" font-weight="400" text-anchor="start">局部变量等栈上数据</text>
<rect x="530" y="316" width="242" height="128" rx="6" fill="#e7f5ed" stroke="#15804a" stroke-width="2.5"/>
<text x="542" y="340" font-size="16" fill="#243447" font-weight="600" text-anchor="start">键盘 TCB · k_thread</text>
<text x="542" y="365" font-size="16" fill="#243447" font-weight="400" text-anchor="start">优先级 2 · 就绪</text>
<text x="542" y="389" font-size="16" fill="#243447" font-weight="400" text-anchor="start">r4–r11：本线程保存值</text>
<text x="542" y="413" font-size="16" fill="#243447" font-weight="400" text-anchor="start">psp = K_SP</text>
<path d="M602 444V478" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#pointer)"/>
<text x="616" y="466" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">指向自己的栈</text>
<rect x="530" y="478" width="242" height="136" rx="6" fill="#e7f5ed" stroke="#15804a" stroke-width="2.5"/>
<text x="542" y="501" font-size="16" fill="#243447" font-weight="600" text-anchor="start">键盘栈 · K_SP 指向异常帧</text>
<text x="542" y="524" font-size="16" fill="#243447" font-weight="400" text-anchor="start">r0–r3、r12、LR</text>
<text x="542" y="546" font-size="16" fill="#243447" font-weight="400" text-anchor="start">PC：等待返回处；xPSR</text>
<path d="M540 557h222" stroke="#cbd5e1"/>
<text x="542" y="580" font-size="16" fill="#243447" font-weight="400" text-anchor="start">原有函数调用帧</text>
<text x="542" y="602" font-size="16" fill="#243447" font-weight="400" text-anchor="start">局部变量等栈上数据</text>
<rect x="302" y="340" width="196" height="142" rx="6" fill="#f3f6fb" stroke="#15804a" stroke-width="2.5"/>
<text x="400.0" y="384.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">同一个 CPU</text>
<text x="400.0" y="406.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">PendSV → 异常返回</text>
<text x="400.0" y="428.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">恢复键盘寄存器</text>
<text x="400.0" y="450.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">PSP 换为 K_SP</text>
<path d="M530 389H498" fill="none" stroke="#15804a" stroke-width="2.4" marker-end="url(#restore)"/>
<text x="514" y="377" font-size="16" fill="#15804a" font-weight="400" text-anchor="middle">③</text>
<path d="M530 531H470V482" fill="none" stroke="#15804a" stroke-width="2.4" marker-end="url(#restore)"/>
<text x="285" y="553" font-size="16" fill="#15804a" font-weight="600" text-anchor="start">④ 硬件恢复异常帧</text>
<text x="284" y="587" font-size="16" fill="#243447" font-weight="400" text-anchor="start">显示现场留在原处</text>
<path d="M28 649h28" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<text x="66" y="654" font-size="16" fill="#2563eb" font-weight="400" text-anchor="start">设备数据</text>
<path d="M182 649h28" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<text x="220" y="654" font-size="16" fill="#7c3aed" font-weight="400" text-anchor="start">唤醒/调度</text>
<path d="M344 649h28" fill="none" stroke="#b95309" stroke-width="2.4" marker-end="url(#save)"/>
<text x="382" y="654" font-size="16" fill="#b95309" font-weight="400" text-anchor="start">保存</text>
<path d="M468 649h28" fill="none" stroke="#15804a" stroke-width="2.4" marker-end="url(#restore)"/>
<text x="506" y="654" font-size="16" fill="#15804a" font-weight="400" text-anchor="start">恢复</text>
<path d="M602 649h28" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#pointer)"/>
<text x="640" y="654" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">栈指针（虚线）</text>
<text x="20" y="686" font-size="16" fill="#243447" font-weight="400" text-anchor="start">Cortex-M 基本现场示意；图中两条驱动路径不代表两个 CPU。</text>
</g></svg>
