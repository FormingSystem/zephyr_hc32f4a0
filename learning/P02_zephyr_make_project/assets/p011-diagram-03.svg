<svg xmlns="http://www.w3.org/2000/svg" width="800" height="362" viewBox="0 0 800 362" role="img" aria-labelledby="title desc">
  <title id="title">公共前缀怎样选出编译和反汇编程序</title>
  <desc id="desc">UCRT64 · 在本节含 probe.c 的实验目录，prefix 已指向工具目录和文件名前缀。手工编译时，前缀、程序名和目标选项各有用途。Zephyr 在 generic.cmake 阶段准备通用工具，在 target.cmake 阶段组织目标编译与链接；两处可以沿用同一个工具前缀。</desc>
  <rect width="800" height="362" fill="#ffffff"/>
  <path d="M400 86 V103 M137.333 103 H662.667" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 170 V187" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M137.333 257 V274" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M400 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M400 170 V187" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M400 257 V274" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M662.667 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M662.667 170 V187" fill="none" stroke="#207767" stroke-width="2"/>
  <path d="M662.667 257 V274" fill="none" stroke="#207767" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="74" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">UCRT64 · 在本节含 probe.c 的实验目录，prefix 已指向工具目录和文件名前缀</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">"${prefix}gcc" -mcpu=cortex-m4 -mthumb -Os -c probe.c -o probe.o</text>
  <rect x="14" y="124" width="246.667" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="137.333" y="152" font-size="17" font-weight="700" fill="#25618b">选择程序</text>
  <rect x="14" y="187" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="215" font-size="16" font-weight="400" fill="#182e3d">prefix 的末尾是</text>
  <text x="137.333" y="239" font-size="16" font-weight="400" fill="#182e3d">arm-zephyr-eabi-</text>
  <rect x="14" y="274" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="302" font-size="16" font-weight="400" fill="#182e3d">拼接 gcc 得到交叉编译器；同</text>
  <text x="137.333" y="326" font-size="16" font-weight="400" fill="#182e3d">目录中还可拼接 objdump</text>
  <rect x="276.667" y="124" width="246.667" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="400" y="152" font-size="17" font-weight="700" fill="#705197">编译一个目标文件</text>
  <rect x="276.667" y="187" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="215" font-size="16" font-weight="400" fill="#182e3d">-mcpu=cortex-m4 -mthumb</text>
  <text x="400" y="239" font-size="16" font-weight="400" fill="#182e3d">-c probe.c -o probe.o</text>
  <rect x="276.667" y="274" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="302" font-size="16" font-weight="400" fill="#182e3d">编译器按 Cortex-M4 目标选项</text>
  <text x="400" y="326" font-size="16" font-weight="400" fill="#182e3d">将源码编成 probe.o</text>
  <rect x="539.333" y="124" width="246.667" height="46" rx="8" fill="#e9f6f2" stroke="#207767" stroke-width="1.5"/>
  <text x="662.667" y="152" font-size="17" font-weight="700" fill="#207767">读取同一结果</text>
  <rect x="539.333" y="187" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="215" font-size="16" font-weight="400" fill="#182e3d">"${prefix}objdump" -d</text>
  <text x="662.667" y="239" font-size="16" font-weight="400" fill="#182e3d">probe.o</text>
  <rect x="539.333" y="274" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="302" font-size="16" font-weight="400" fill="#182e3d">反汇编器从目标文件读出机器</text>
  <text x="662.667" y="326" font-size="16" font-weight="400" fill="#182e3d">指令，两条命令共用同一前缀</text>
  </g>
</svg>
