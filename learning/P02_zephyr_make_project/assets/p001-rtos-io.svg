<svg xmlns="http://www.w3.org/2000/svg" width="800" height="916" viewBox="0 0 800 916" role="img" aria-labelledby="title desc">
<title id="title">三条固定的数据流，由 RTOS 安排各段的 CPU 时间</title><desc id="desc">每行从初始化绑定，经中断或回调、独立内存交接区、对应处理线程，到结果使用方。绑定不是运行时数据。线程由消息或完成通知唤醒，不持续轮询内存。显示发送另列，完成事件进入第三行。底部展示键盘报告到达后的一段单核 CPU 调度。</desc>
<defs>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
<marker id="save" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b95309"/></marker>
<marker id="restore" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#15804a"/></marker>
<marker id="pointer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
</defs>
<rect width="800" height="916" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243447">
<text x="20" y="28" font-size="16" fill="#243447" font-weight="600" text-anchor="start">数据沿固定路径流动，CPU 按就绪状态交替执行</text>
<path d="M20 56h28" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<text x="58" y="61" font-size="16" fill="#2563eb" font-weight="400" text-anchor="start">数据 / 驱动调用</text>
<path d="M280 56h28" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<text x="318" y="61" font-size="16" fill="#7c3aed" font-weight="400" text-anchor="start">中断 / 唤醒</text>
<path d="M560 56h28" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#pointer)"/>
<text x="598" y="61" font-size="16" fill="#64748b" font-weight="400" text-anchor="start">初始化绑定（虚线）</text>
<text x="20" y="101" font-size="16" fill="#243447" font-weight="600" text-anchor="start">初始化一次</text>
<text x="177" y="101" font-size="16" fill="#243447" font-weight="600" text-anchor="start">事件处理</text>
<text x="334" y="101" font-size="16" fill="#243447" font-weight="600" text-anchor="start">RAM 中交接</text>
<text x="491" y="101" font-size="16" fill="#243447" font-weight="600" text-anchor="start">线程获得 CPU</text>
<text x="648" y="101" font-size="16" fill="#243447" font-weight="600" text-anchor="start">结果交给谁</text>
<text x="20" y="128" font-size="16" fill="#243447" font-weight="600" text-anchor="start">① 鼠标路径</text>
<text x="177" y="128" font-size="16" fill="#7c3aed" font-weight="400" text-anchor="start">USB 主机取得鼠标报告</text>
<path d="M243 134V142" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<rect x="20" y="142" width="132" height="104" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
<text x="86.0" y="178.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">鼠标驱动</text>
<text x="86.0" y="200.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">绑定处理函数</text>
<text x="86.0" y="222.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">配置控制器 IRQ</text>
<rect x="177" y="142" width="132" height="104" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="243.0" y="178.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">接收 ISR/回调</text>
<text x="243.0" y="200.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">读取本次报告</text>
<text x="243.0" y="222.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">尽快退出</text>
<rect x="334" y="142" width="132" height="104" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="400.0" y="178.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">鼠标报告队列</text>
<text x="400.0" y="200.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">保存报告副本</text>
<text x="400.0" y="222.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">空队列可等待</text>
<rect x="491" y="142" width="132" height="104" rx="6" fill="#e7f5ed" stroke="#94a3b8" stroke-width="1.3"/>
<text x="557.0" y="167.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">鼠标处理线程</text>
<text x="557.0" y="189.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">有事件才就绪</text>
<text x="557.0" y="211.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">获 CPU 后处理</text>
<text x="557.0" y="233.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">无数据就阻塞</text>
<rect x="648" y="142" width="132" height="104" rx="6" fill="#fff9eb" stroke="#94a3b8" stroke-width="1.3"/>
<text x="714.0" y="178.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">界面状态</text>
<text x="714.0" y="200.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">更新光标位置</text>
<text x="714.0" y="222.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">供显示线程用</text>
<path d="M152 194H177" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#pointer)"/>
<path d="M309 194H334" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<path d="M466 178H491" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<path d="M466 218H491" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<path d="M623 194H648" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<text x="334" y="269" font-size="16" fill="#243447" font-weight="400" text-anchor="start">上蓝线：取数据；下紫线：解除等待</text>
<text x="20" y="288" font-size="16" fill="#243447" font-weight="600" text-anchor="start">② 键盘路径</text>
<text x="177" y="288" font-size="16" fill="#7c3aed" font-weight="400" text-anchor="start">USB 主机取得键盘报告</text>
<path d="M243 294V302" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<rect x="20" y="302" width="132" height="104" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
<text x="86.0" y="338.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">键盘驱动</text>
<text x="86.0" y="360.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">绑定处理函数</text>
<text x="86.0" y="382.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">配置控制器 IRQ</text>
<rect x="177" y="302" width="132" height="104" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="243.0" y="338.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">接收 ISR/回调</text>
<text x="243.0" y="360.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">读取本次报告</text>
<text x="243.0" y="382.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">尽快退出</text>
<rect x="334" y="302" width="132" height="104" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="400.0" y="338.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">键盘报告队列</text>
<text x="400.0" y="360.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">保存报告副本</text>
<text x="400.0" y="382.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">空队列可等待</text>
<rect x="491" y="302" width="132" height="104" rx="6" fill="#e7f5ed" stroke="#94a3b8" stroke-width="1.3"/>
<text x="557.0" y="327.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">键盘处理线程</text>
<text x="557.0" y="349.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">有事件才就绪</text>
<text x="557.0" y="371.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">获 CPU 后处理</text>
<text x="557.0" y="393.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">无数据就阻塞</text>
<rect x="648" y="302" width="132" height="104" rx="6" fill="#fff9eb" stroke="#94a3b8" stroke-width="1.3"/>
<text x="714.0" y="338.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">输入状态</text>
<text x="714.0" y="360.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">更新按键 / 文本</text>
<text x="714.0" y="382.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">供应用逻辑用</text>
<path d="M152 354H177" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#pointer)"/>
<path d="M309 354H334" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<path d="M466 338H491" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<path d="M466 378H491" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<path d="M623 354H648" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<text x="334" y="429" font-size="16" fill="#243447" font-weight="400" text-anchor="start">上蓝线：取数据；下紫线：解除等待</text>
<text x="20" y="448" font-size="16" fill="#243447" font-weight="600" text-anchor="start">③ 显示路径</text>
<text x="177" y="448" font-size="16" fill="#7c3aed" font-weight="400" text-anchor="start">DMA / SPI 完成事件</text>
<path d="M243 454V462" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<rect x="20" y="462" width="132" height="104" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
<text x="86.0" y="498.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">显示驱动</text>
<text x="86.0" y="520.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">绑定处理函数</text>
<text x="86.0" y="542.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">配置控制器 IRQ</text>
<rect x="177" y="462" width="132" height="104" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="243.0" y="498.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">完成 ISR/回调</text>
<text x="243.0" y="520.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">确认完成状态</text>
<text x="243.0" y="542.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">发布完成通知</text>
<rect x="334" y="462" width="132" height="104" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="400.0" y="498.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">完成状态块</text>
<text x="400.0" y="520.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">另配完成信号量</text>
<text x="400.0" y="542.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">不保存像素副本</text>
<rect x="491" y="462" width="132" height="104" rx="6" fill="#fff4df" stroke="#94a3b8" stroke-width="1.3"/>
<text x="557.0" y="487.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">显示服务线程</text>
<text x="557.0" y="509.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">有事件才就绪</text>
<text x="557.0" y="531.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">获 CPU 后处理</text>
<text x="557.0" y="553.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">无数据就阻塞</text>
<rect x="648" y="462" width="132" height="104" rx="6" fill="#fff9eb" stroke="#94a3b8" stroke-width="1.3"/>
<text x="714.0" y="498.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">帧缓冲管理</text>
<text x="714.0" y="520.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">归还已发缓冲</text>
<text x="714.0" y="542.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">准备下一帧</text>
<path d="M152 514H177" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#pointer)"/>
<path d="M309 514H334" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<path d="M466 498H491" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<path d="M466 538H491" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<path d="M623 514H648" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<text x="334" y="589" font-size="16" fill="#243447" font-weight="400" text-anchor="start">上蓝线：取数据；下紫线：解除等待</text>
<text x="20" y="608" font-size="16" fill="#243447" font-weight="600" text-anchor="start">开始一帧时，显示线程还会主动发起这条输出路径：</text>
<rect x="20" y="626" width="160" height="54" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="100.0" y="648.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">显示服务线程</text>
<text x="100.0" y="670.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">提交像素缓冲</text>
<path d="M180 653H220" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<rect x="220" y="626" width="160" height="54" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="300.0" y="648.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">显示驱动 API</text>
<text x="300.0" y="670.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">配置并启动传输</text>
<path d="M380 653H420" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<rect x="420" y="626" width="160" height="54" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="500.0" y="648.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">DMA / SPI</text>
<text x="500.0" y="670.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">硬件发送</text>
<path d="M580 653H620" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<rect x="620" y="626" width="160" height="54" rx="6" fill="#edf4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="700.0" y="648.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">显示屏</text>
<text x="700.0" y="670.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">接收像素</text>
<text x="20" y="704" font-size="16" fill="#243447" font-weight="400" text-anchor="start">完成事件回到③。等待传输期间，显示线程阻塞，硬件仍可继续工作。</text>
<text x="20" y="734" font-size="16" fill="#243447" font-weight="600" text-anchor="start">一次键盘事件：依次使用同一 CPU；无报告时不参与调度</text>
<rect x="20" y="750" width="152" height="54" rx="6" fill="#f3edff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="96.0" y="772.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">接收 ISR</text>
<text x="96.0" y="794.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">入队并唤醒</text>
<rect x="172" y="750" width="152" height="54" rx="6" fill="#f3edff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="248.0" y="772.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">调度 / 切入</text>
<text x="248.0" y="794.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">恢复键盘现场</text>
<rect x="324" y="750" width="152" height="54" rx="6" fill="#e7f5ed" stroke="#94a3b8" stroke-width="1.3"/>
<text x="400.0" y="772.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">键盘线程</text>
<text x="400.0" y="794.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">处理已有报告</text>
<rect x="476" y="750" width="152" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
<text x="552.0" y="772.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">队列空：阻塞</text>
<text x="552.0" y="794.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">内核切回</text>
<rect x="628" y="750" width="152" height="54" rx="6" fill="#fff4df" stroke="#94a3b8" stroke-width="1.3"/>
<text x="704.0" y="772.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">其他就绪线程</text>
<text x="704.0" y="794.0" font-size="16" fill="#243447" font-weight="400" text-anchor="middle">继续已有工作</text>
<text x="20" y="830" font-size="16" fill="#243447" font-weight="400" text-anchor="start">若所有线程都在等待，进入空闲；不分配给无数据线程来凑满时间片。</text>
<text x="20" y="857" font-size="16" fill="#243447" font-weight="400" text-anchor="start">蓝线：数据或调用；紫线：解除等待；灰色虚线：初始化绑定。</text>
<text x="20" y="882" font-size="16" fill="#243447" font-weight="400" text-anchor="start">下方色块：浅紫接收/调度，浅绿键盘业务，浅灰阻塞/切回，浅黄其他工作。</text>
<text x="20" y="906" font-size="16" fill="#243447" font-weight="400" text-anchor="start">三个线程各有 TCB 与栈。接收回调实际上下文见正文；流程不按时间比例。</text>
</g></svg>
