<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img" aria-labelledby="title desc"><title id="title">按阶段验收，留下可以解释的结果</title><desc id="desc">按阶段验收，留下可以解释的结果</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66788a"/></marker></defs><rect width="800" height="210" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243447"><rect x="20" y="20" width="240" height="60" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="140" y="56" font-size="16" text-anchor="middle"><tspan x="140" dy="0">1 认识已有板</tspan></text><rect x="280" y="20" width="240" height="60" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="400" y="56" font-size="16" text-anchor="middle"><tspan x="400" dy="0">2 编译已有板</tspan></text><path d="M260 50 H280" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="540" y="20" width="240" height="60" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="660" y="56" font-size="16" text-anchor="middle"><tspan x="660" dy="0">3 对照新增板</tspan></text><path d="M520 50 H540" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="540" y="130" width="240" height="60" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="660" y="166" font-size="16" text-anchor="middle"><tspan x="660" dy="0">4 新增芯片支持</tspan></text><path d="M660 80 V130" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="280" y="130" width="240" height="60" rx="7" fill="#e6f3ec" stroke="#66788a"/><text x="400" y="166" font-size="16" text-anchor="middle"><tspan x="400" dy="0">5 核验结果</tspan></text><rect x="280" y="130" width="240" height="60" rx="7" fill="none" stroke="#007f8a" stroke-width="3"/><path d="M540 160 H520" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/></g></svg>
