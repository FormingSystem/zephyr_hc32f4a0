  <title id="title">一次配置从哪里得到工程规则、工具和外部源码</title>
  <desc id="desc">samples/hello_world/CMakeLists.txt · 官方板的 SDK 自动发现路线。这次配置显式给出 Zephyr_DIR。进入 Zephyr 构建规则后，SDK 查找定位工具，工作区模块发现定位 CMSIS；三处可分别核对。</desc>
