  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">find_package(Zephyr REQUIRED HINTS $ENV{ZEPHYR_BASE})</text>
  <rect x="14" y="124" width="246.667" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
