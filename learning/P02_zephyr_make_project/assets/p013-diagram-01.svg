<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 0 800 386" role="img" aria-labelledby="title desc">
  <title id="title">一个模块怎样同时出现在发现记录和编译清单中</title>
  <desc id="desc">component_hello 示例 · 从模块根读取入口声明。关闭版仍会读取 module.yml，所以发现记录里仍有 app_greeting。改变的是 .config 里的开关和编译清单里的 greeting.c。</desc>
  <rect width="800" height="386" fill="#ffffff"/>
  <path d="M400 86 V103 M137.333 103 H662.667" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 170 V187" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M137.333 233 V250" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M400 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M400 170 V187" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M400 233 V250" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M662.667 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M662.667 170 V187" fill="none" stroke="#207767" stroke-width="2"/>
  <path d="M662.667 233 V250" fill="none" stroke="#207767" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="74" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">component_hello 示例 · 从模块根读取入口声明</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">app_greeting/zephyr/module.yml</text>
  <rect x="14" y="124" width="246.667" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="137.333" y="152" font-size="17" font-weight="700" fill="#25618b">模块名</text>
  <rect x="14" y="187" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="215" font-size="16" font-weight="400" fill="#182e3d">name: app_greeting</text>
  <rect x="14" y="250" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="278" font-size="16" font-weight="400" fill="#182e3d">向构建提供模块根后，</text>
  <text x="137.333" y="302" font-size="16" font-weight="400" fill="#182e3d">zephyr_modules.txt 记录已识</text>
  <text x="137.333" y="326" font-size="16" font-weight="400" fill="#182e3d">别的模块</text>
  <rect x="276.667" y="124" width="246.667" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="400" y="152" font-size="17" font-weight="700" fill="#705197">功能开关</text>
  <rect x="276.667" y="187" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="215" font-size="16" font-weight="400" fill="#182e3d">build.kconfig: Kconfig</text>
  <rect x="276.667" y="250" width="246.667" height="118" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="278" font-size="16" font-weight="400" fill="#182e3d">应用 prj.conf 开启</text>
  <text x="400" y="302" font-size="16" font-weight="400" fill="#182e3d">APP_GREETING；off.conf 将</text>
  <text x="400" y="326" font-size="16" font-weight="400" fill="#182e3d">它关闭。结果记录在</text>
  <text x="400" y="350" font-size="16" font-weight="400" fill="#182e3d">zephyr/.config</text>
  <rect x="539.333" y="124" width="246.667" height="46" rx="8" fill="#e9f6f2" stroke="#207767" stroke-width="1.5"/>
  <text x="662.667" y="152" font-size="17" font-weight="700" fill="#207767">条件选源</text>
  <rect x="539.333" y="187" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="215" font-size="16" font-weight="400" fill="#182e3d">build.cmake: .</text>
  <rect x="539.333" y="250" width="246.667" height="118" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="278" font-size="16" font-weight="400" fill="#182e3d">根 CMakeLists.txt 在开关开启</text>
  <text x="662.667" y="302" font-size="16" font-weight="400" fill="#182e3d">时加入 src/greeting.c 和</text>
  <text x="662.667" y="326" font-size="16" font-weight="400" fill="#182e3d">include；在编译清单核对</text>
  <text x="662.667" y="350" font-size="16" font-weight="400" fill="#182e3d">greeting.c</text>
  </g>
</svg>
