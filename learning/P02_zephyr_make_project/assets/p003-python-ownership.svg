<svg xmlns="http://www.w3.org/2000/svg" width="800" height="362" viewBox="0 0 800 362" role="img" aria-labelledby="title desc">
  <title id="title">哪一份 Python 创建并拥有工程环境</title>
  <desc id="desc">UCRT64 · Zephyr 源码根，已安装本例的 Windows Python。py -3.12 选创建环境的解释器，.venv 是创建位置。激活后用 python -m pip --version 检查输出路径，即可确认后续依赖装进哪一份环境。</desc>
  <rect width="800" height="362" fill="#ffffff"/>
  <path d="M400 86 V103 M137.333 103 H662.667" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 170 V187" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M137.333 233 V250" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M400 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M400 170 V187" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M400 233 V250" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M662.667 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M662.667 170 V187" fill="none" stroke="#207767" stroke-width="2"/>
  <path d="M662.667 233 V250" fill="none" stroke="#207767" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="74" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">UCRT64 · Zephyr 源码根，已安装本例的 Windows Python</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">py -3.12 -m venv .venv</text>
  <rect x="14" y="124" width="246.667" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="137.333" y="152" font-size="17" font-weight="700" fill="#25618b">选择创建者</text>
  <rect x="14" y="187" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="215" font-size="16" font-weight="400" fill="#182e3d">py -3.12</text>
  <rect x="14" y="250" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="278" font-size="16" font-weight="400" fill="#182e3d">Windows 启动器</text>
  <text x="137.333" y="302" font-size="16" font-weight="400" fill="#182e3d">选择 3.12 解释器</text>
  <rect x="276.667" y="124" width="246.667" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="400" y="152" font-size="17" font-weight="700" fill="#705197">选择操作和目的目录</text>
  <rect x="276.667" y="187" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="215" font-size="16" font-weight="400" fill="#182e3d">-m venv .venv</text>
  <rect x="276.667" y="250" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="278" font-size="16" font-weight="400" fill="#182e3d">在源码根创建 .venv</text>
  <text x="400" y="302" font-size="16" font-weight="400" fill="#182e3d">Scripts/python.exe</text>
  <text x="400" y="326" font-size="16" font-weight="400" fill="#182e3d">Lib/site-packages</text>
  <rect x="539.333" y="124" width="246.667" height="46" rx="8" fill="#e9f6f2" stroke="#207767" stroke-width="1.5"/>
  <text x="662.667" y="152" font-size="17" font-weight="700" fill="#207767">当前终端使用环境</text>
  <rect x="539.333" y="187" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="215" font-size="16" font-weight="400" fill="#182e3d">source .venv/Scripts/activate</text>
  <rect x="539.333" y="250" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="278" font-size="16" font-weight="400" fill="#182e3d">python -m pip --version 显示</text>
  <text x="662.667" y="302" font-size="16" font-weight="400" fill="#182e3d">项目环境中的 pip；关闭终端</text>
  <text x="662.667" y="326" font-size="16" font-weight="400" fill="#182e3d">后环境文件仍在</text>
  </g>
</svg>
