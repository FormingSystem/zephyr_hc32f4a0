<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" role="img" aria-labelledby="title desc">
<title id="title">Windows Python 创建项目环境后由激活控制命令选择</title>
<desc id="desc">Windows Python 创建项目环境后由激活控制命令选择。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="20" y="25" width="300" height="80" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="170.0" y="59.0" text-anchor="middle" font-weight="700">已安装的 Windows CPython</text>
<text x="170.0" y="83.0" text-anchor="middle">py -3.12 选择版本</text>
<rect x="440" y="25" width="300" height="80" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="590.0" y="47.0" text-anchor="middle" font-weight="700">源码根下的 .venv</text>
<text x="590.0" y="71.0" text-anchor="middle">Scripts/python.exe</text>
<text x="590.0" y="95.0" text-anchor="middle">Lib/site-packages</text>
<polyline points="320,65 440,65" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<text x="357" y="47" text-anchor="start" fill="#217346">创建</text>
<rect x="20" y="190" width="300" height="80" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="170.0" y="224.0" text-anchor="middle" font-weight="700">当前 UCRT64 Bash</text>
<text x="170.0" y="248.0" text-anchor="middle">source .../Scripts/activate</text>
<rect x="440" y="190" width="300" height="80" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="590.0" y="224.0" text-anchor="middle" font-weight="700">本窗口 PATH 优先选 .venv</text>
<text x="590.0" y="248.0" text-anchor="middle">python -m pip 安装到这里</text>
<polyline points="320,230 440,230" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<text x="357" y="212" text-anchor="start" fill="#7540a0">激活</text>
<polyline points="590,105 590,190" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<rect x="440" y="335" width="300" height="65" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="590.0" y="361.5" text-anchor="middle" font-weight="700">west 与 Zephyr Python 依赖</text>
<text x="590.0" y="385.5" text-anchor="middle">属于所选项目解释器</text>
<polyline points="590,270 590,335" fill="none" stroke="#b45b13" stroke-width="2" marker-end="url(#orange)"/>
<text x="25" y="345" text-anchor="start">关闭窗口：PATH 选择结束。</text>
<text x="25" y="375" text-anchor="start">磁盘上的 .venv 和包仍保留。</text>
<line x1="24" y1="438" x2="48" y2="438" stroke="#1769aa"/>
<text x="54" y="443" text-anchor="start">已安装解释器</text>
<line x1="172" y1="438" x2="196" y2="438" stroke="#217346"/>
<text x="202" y="443" text-anchor="start">创建文件</text>
<line x1="288" y1="438" x2="312" y2="438" stroke="#7540a0"/>
<text x="318" y="443" text-anchor="start">本窗口选择</text>
<line x1="420" y1="438" x2="444" y2="438" stroke="#b45b13"/>
<text x="450" y="443" text-anchor="start">项目包</text>
</g></svg>