<svg xmlns="http://www.w3.org/2000/svg" width="800" height="401" viewBox="0 0 800 401" role="img" aria-labelledby="title desc">
  <title id="title">一条 ARM 编译命令的工具路径与目标参数从何而来</title>
  <desc id="desc">MPS2/AN386 · 在构建目录读取实际编译命令。打开一条编译记录，先看 GCC 路径指向哪套 SDK，再读 -mcpu 和 -mthumb。前者可追到已发现的工具包，后两项可追到板所选的处理器配置。</desc>
  <rect width="800" height="401" fill="#ffffff"/>
  <path d="M400 86 V103 M203 103 H597" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M203 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M203 170 V187" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M203 233 V250" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M203 296 V313" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M597 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M597 170 V187" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M597 233 V250" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M597 296 V313" fill="none" stroke="#705197" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="74" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">MPS2/AN386 · 在构建目录读取实际编译命令</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">compile_commands.json</text>
  <rect x="14" y="124" width="378" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="203" y="152" font-size="17" font-weight="700" fill="#25618b">编译程序的位置</text>
  <rect x="14" y="187" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="215" font-size="16" font-weight="400" fill="#182e3d">已发现的 SDK 根与 ARCH=arm</text>
  <rect x="14" y="250" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="278" font-size="16" font-weight="400" fill="#182e3d">SDK 的 GNU 规则选择 arm-zephyr-eabi 工具族</text>
  <rect x="14" y="313" width="378" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="341" font-size="16" font-weight="400" fill="#182e3d">gnu/arm-zephyr-eabi/bin/</text>
  <text x="203" y="365" font-size="16" font-weight="400" fill="#182e3d">arm-zephyr-eabi-gcc</text>
  <rect x="408" y="124" width="378" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="597" y="152" font-size="17" font-weight="700" fill="#705197">目标处理器与指令</text>
  <rect x="408" y="187" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="597" y="215" font-size="16" font-weight="400" fill="#182e3d">BOARD=mps2/an386</text>
  <rect x="408" y="250" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="597" y="278" font-size="16" font-weight="400" fill="#182e3d">板和 SoC 配置选中 CPU_CORTEX_M4</text>
  <rect x="408" y="313" width="378" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="597" y="341" font-size="16" font-weight="400" fill="#182e3d">GCC 的 ARM 目标规则产生 -mcpu=cortex-m4</text>
  <text x="597" y="365" font-size="16" font-weight="400" fill="#182e3d">与 -mthumb，浮点选项取决于实际配置</text>
  </g>
</svg>
