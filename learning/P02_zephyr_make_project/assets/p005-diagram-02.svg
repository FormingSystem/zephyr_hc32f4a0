<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">完整 GNU、Minimal 加 ARM、独立 ARM 三条路线</title><desc id="desc">①完整 GNU 解压后已有 ARM；②Minimal 补入 ARM 后与①共用 SDK 接口；③独立 ARM 目录使用 cross-compile。三条路线按需选择一条。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b95309"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
</defs><rect width="800" height="480" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#243447">
<text x="20" y="26" font-weight="600" fill="#243447" text-anchor="start">下载什么</text>
<text x="284" y="26" font-weight="600" fill="#243447" text-anchor="start">怎样取得 ARM 工具</text>
<text x="562" y="26" font-weight="600" fill="#243447" text-anchor="start">安装结果与工程接入</text>
<rect x="20" y="48" width="220" height="80" rx="7" fill="#edf4ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="130" y="83" font-weight="600" fill="#243447" text-anchor="middle">① 完整 GNU 包</text>
<text x="130" y="105" font-weight="400" fill="#243447" text-anchor="middle">SDK 框架 + 多种目标</text>
<rect x="280" y="48" width="230" height="80" rx="7" fill="#edf4ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="395" y="83" font-weight="600" fill="#243447" text-anchor="middle">解压到安装父目录</text>
<text x="395" y="105" font-weight="400" fill="#243447" text-anchor="middle">ARM 已在 SDK 的 gnu 下</text>
<path d="M240 88H280" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path d="M510 88H540V128H562" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="20" y="182" width="220" height="80" rx="7" fill="#fff4df" stroke="#b95309" stroke-width="1.5"/>
<text x="130" y="217" font-weight="600" fill="#243447" text-anchor="middle">② Minimal 包</text>
<text x="130" y="239" font-weight="400" fill="#243447" text-anchor="middle">SDK 框架，无目标工具链</text>
<rect x="280" y="172" width="230" height="100" rx="7" fill="#fff4df" stroke="#b95309" stroke-width="1.5"/>
<text x="395" y="206" font-weight="600" fill="#243447" text-anchor="middle">补入同版 ARM 组件</text>
<text x="395" y="228" font-weight="400" fill="#243447" text-anchor="middle">setup 在线下载</text>
<text x="395" y="250" font-weight="400" fill="#243447" text-anchor="middle">或 7-Zip 解压到 SDK/gnu</text>
<path d="M240 222H280" fill="none" stroke="#b95309" stroke-width="2" marker-end="url(#orange)"/>
<path d="M510 222H540V172H562" fill="none" stroke="#b95309" stroke-width="2" marker-end="url(#orange)"/>
<rect x="562" y="78" width="218" height="122" rx="7" fill="#edf8f0" stroke="#15804a" stroke-width="1.5"/>
<text x="671" y="123" font-weight="600" fill="#243447" text-anchor="middle">共同结果：SDK 根</text>
<text x="671" y="145" font-weight="400" fill="#243447" text-anchor="middle">cmake/ 包入口</text>
<text x="671" y="167" font-weight="400" fill="#243447" text-anchor="middle">gnu/arm-zephyr-eabi/</text>
<rect x="562" y="216" width="218" height="68" rx="7" fill="#edf8f0" stroke="#15804a" stroke-width="1.5"/>
<text x="671" y="245" font-weight="600" fill="#243447" text-anchor="middle">SDK 工程接口</text>
<text x="671" y="267" font-weight="400" fill="#243447" text-anchor="middle">注册或显式传 SDK 根</text>
<path d="M671 200V216" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#gray)"/>
<rect x="20" y="330" width="220" height="80" rx="7" fill="#f4efff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="130" y="365" font-weight="600" fill="#243447" text-anchor="middle">③ 只取 ARM 组件</text>
<text x="130" y="387" font-weight="400" fill="#243447" text-anchor="middle">不组装 SDK</text>
<rect x="280" y="330" width="230" height="80" rx="7" fill="#f4efff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="395" y="365" font-weight="600" fill="#243447" text-anchor="middle">解压到安装父目录</text>
<text x="395" y="387" font-weight="400" fill="#243447" text-anchor="middle">独立 arm-zephyr-eabi/</text>
<rect x="562" y="330" width="218" height="80" rx="7" fill="#f4efff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="671" y="354" font-weight="600" fill="#243447" text-anchor="middle">独立工具链接口</text>
<text x="671" y="376" font-weight="400" fill="#243447" text-anchor="middle">cross-compile</text>
<text x="671" y="398" font-weight="400" fill="#243447" text-anchor="middle">CROSS_COMPILE 前缀</text>
<path d="M240 370H280" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>
<path d="M510 370H562" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#gray)"/>
<text x="20" y="446" font-weight="400" fill="#243447" text-anchor="start">蓝①：完整 GNU　橙②：按需补装　紫③：独立 ARM　绿：SDK 安装结果</text>
<text x="20" y="468" font-weight="400" fill="#243447" text-anchor="start">实线：解压或补装的推进；灰色虚线：安装完成后的工程接入。</text>
</g></svg>
