<svg xmlns="http://www.w3.org/2000/svg" width="800" height="496" viewBox="0 0 800 496" role="img" aria-labelledby="title desc"><title id="title">有些接口文档为什么藏在 CMake 文件的注释里</title><desc id="desc">按失败阶段选择排查入口</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66788a"/></marker></defs><rect width="800" height="496" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243447"><text x="20" y="28" font-size="18" text-anchor="start" font-weight="600"><tspan x="20" dy="0">失败发生在哪里？沿对应行选择检查对象。</tspan></text><rect x="20" y="58" width="270" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="155" y="97" font-size="16" text-anchor="middle"><tspan x="155" dy="0">找不到包、模块、板</tspan></text><rect x="370" y="58" width="410" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="575" y="97" font-size="16" text-anchor="middle"><tspan x="575" dy="0">查来源、路径、版本与缓存</tspan></text><rect x="20" y="142" width="270" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="155" y="169.5" font-size="16" text-anchor="middle"><tspan x="155" dy="0">配置不满足</tspan><tspan x="155" dy="23">或设备树处理失败</tspan></text><rect x="370" y="142" width="410" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="575" y="169.5" font-size="16" text-anchor="middle"><tspan x="575" dy="0">查配置输入、依赖约束</tspan><tspan x="575" dy="23">以及最终硬件描述</tspan></text><rect x="20" y="226" width="270" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="155" y="265" font-size="16" text-anchor="middle"><tspan x="155" dy="0">C / 汇编编译失败</tspan></text><rect x="370" y="226" width="410" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="575" y="265" font-size="16" text-anchor="middle"><tspan x="575" dy="0">查首条错误、头文件和实际编译参数</tspan></text><rect x="20" y="310" width="270" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="155" y="349" font-size="16" text-anchor="middle"><tspan x="155" dy="0">链接失败</tspan></text><rect x="370" y="310" width="410" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="575" y="349" font-size="16" text-anchor="middle"><tspan x="575" dy="0">查符号、选源、内存区域和 map</tspan></text><rect x="20" y="394" width="270" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="155" y="433" font-size="16" text-anchor="middle"><tspan x="155" dy="0">运行无输出或行为异常</tspan></text><rect x="370" y="394" width="410" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="575" y="433" font-size="16" text-anchor="middle"><tspan x="575" dy="0">查加载目标、启动、设备就绪与连接</tspan></text><path d="M290 91 H370" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M290 175 H370" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M290 259 H370" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M290 343 H370" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M290 427 H370" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/></g></svg>
