<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">普通组件的发现选源和运行调用分属不同阶段</title>
<desc id="desc">普通组件的发现选源和运行调用分属不同阶段。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="20" y="25" width="340" height="265" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="38" y="52" text-anchor="start" font-weight="700">模块 app_greeting：自己创建</text>
<rect x="40" y="75" width="300" height="60" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="190.0" y="99.0" text-anchor="middle" font-weight="700">zephyr/module.yml</text>
<text x="190.0" y="123.0" text-anchor="middle">标明 CMake / Kconfig 入口</text>
<rect x="40" y="165" width="300" height="95" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="190.0" y="194.5" text-anchor="middle" font-weight="700">Kconfig：定义 APP_GREETING</text>
<text x="190.0" y="218.5" text-anchor="middle">CMakeLists.txt：按配置选源</text>
<text x="190.0" y="242.5" text-anchor="middle">src/greeting.c / include/</text>
<polyline points="190,135 190,165" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<rect x="430" y="75" width="310" height="90" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="585.0" y="102.0" text-anchor="middle" font-weight="700">应用 component_hello</text>
<text x="585.0" y="126.0" text-anchor="middle">prj.conf：选择开启功能</text>
<text x="585.0" y="150.0" text-anchor="middle">main.c：调用组件接口</text>
<rect x="430" y="230" width="310" height="65" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="585.0" y="256.5" text-anchor="middle" font-weight="700">配置并编译、链接</text>
<text x="585.0" y="280.5" text-anchor="middle">仅选中的源码进入固件</text>
<polyline points="340,212 390,212 390,262 430,262" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<polyline points="585,165 585,230" fill="none" stroke="#b45b13" stroke-width="2" marker-end="url(#orange)"/>
<rect x="210" y="365" width="420" height="65" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="420.0" y="391.5" text-anchor="middle" font-weight="700">芯片运行：main → greeting 函数</text>
<text x="420.0" y="415.5" text-anchor="middle">此时不再解析 module.yml / Kconfig</text>
<polyline points="585,295 585,365" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<line x1="24" y1="473" x2="48" y2="473" stroke="#1769aa"/>
<text x="54" y="478" text-anchor="start">模块身份</text>
<line x1="140" y1="473" x2="164" y2="473" stroke="#7540a0"/>
<text x="170" y="478" text-anchor="start">配置/选源</text>
<line x1="272" y1="473" x2="296" y2="473" stroke="#b45b13"/>
<text x="302" y="478" text-anchor="start">应用需求</text>
<line x1="388" y1="473" x2="412" y2="473" stroke="#217346"/>
<text x="418" y="478" text-anchor="start">产物/执行</text>
</g></svg>