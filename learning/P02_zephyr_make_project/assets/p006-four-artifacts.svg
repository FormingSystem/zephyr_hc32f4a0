  <text x="137.333" y="326" font-size="16" font-weight="400" fill="#182e3d">modules/hal/cmsis_6 提供实</text>
  <text x="137.333" y="350" font-size="16" font-weight="400" fill="#182e3d">际头文件</text>
  <rect x="276.667" y="124" width="246.667" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="400" y="152" font-size="17" font-weight="700" fill="#705197">主机上的工具</text>
  <rect x="276.667" y="187" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="215" font-size="16" font-weight="400" fill="#182e3d">Python、CMake 和 Ninja</text>
  <rect x="276.667" y="250" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="278" font-size="16" font-weight="400" fill="#182e3d">SDK 内的 ARM 编译器</text>
  <text x="400" y="302" font-size="16" font-weight="400" fill="#182e3d">在电脑上运行，产生可供</text>
  <text x="400" y="326" font-size="16" font-weight="400" fill="#182e3d">目标处理器执行的机器码</text>
  <rect x="539.333" y="124" width="246.667" height="46" rx="8" fill="#e9f6f2" stroke="#207767" stroke-width="1.5"/>
  <text x="662.667" y="152" font-size="17" font-weight="700" fill="#207767">独立的输出目录</text>
