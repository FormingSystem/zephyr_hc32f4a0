<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 0 800 386" role="img" aria-labelledby="title desc">
  <title id="title">追加的两个模块怎样分工</title>
  <desc id="desc">UCRT64 · HC32 构建命令传给 CMake 的模块参数。沿第一个变量能找到厂商函数，沿第二个变量能找到调用它的 Zephyr 驱动。两份源码各自进入模块记录，实际参加编译的文件还可以在同一构建目录的编译清单中逐项核对。</desc>
  <rect width="800" height="386" fill="#ffffff"/>
  <path d="M400 86 V103 M137.333 103 H662.667" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 170 V187" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M137.333 233 V250" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M400 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M400 170 V187" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M400 257 V274" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M662.667 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M662.667 170 V187" fill="none" stroke="#207767" stroke-width="2"/>
  <path d="M662.667 257 V274" fill="none" stroke="#207767" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="74" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">UCRT64 · HC32 构建命令传给 CMake 的模块参数</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">"-DEXTRA_ZEPHYR_MODULES=$HAL_XHSC_DIR;$HC32_PORT_DIR"</text>
  <rect x="14" y="124" width="246.667" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="137.333" y="152" font-size="17" font-weight="700" fill="#25618b">$HAL_XHSC_DIR</text>
  <rect x="14" y="187" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="215" font-size="16" font-weight="400" fill="#182e3d">hal_xhsc/zephyr/module.yml</text>
  <rect x="14" y="250" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="278" font-size="16" font-weight="400" fill="#182e3d">厂商设备头给出 USART 定</text>
  <text x="137.333" y="302" font-size="16" font-weight="400" fill="#182e3d">义，DDL 提供</text>
  <text x="137.333" y="326" font-size="16" font-weight="400" fill="#182e3d">USART_WriteData</text>
  <rect x="276.667" y="124" width="246.667" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="400" y="152" font-size="17" font-weight="700" fill="#705197">$HC32_PORT_DIR</text>
  <rect x="276.667" y="187" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="215" font-size="16" font-weight="400" fill="#182e3d">hc32_port/zephyr/</text>
  <text x="400" y="239" font-size="16" font-weight="400" fill="#182e3d">module.yml</text>
  <rect x="276.667" y="274" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="302" font-size="16" font-weight="400" fill="#182e3d">板和 SoC 描述选定 USART；</text>
  <text x="400" y="326" font-size="16" font-weight="400" fill="#182e3d">drivers/serial/uart_hc32.c 将</text>
  <text x="400" y="350" font-size="16" font-weight="400" fill="#182e3d">接口接到 DDL</text>
  <rect x="539.333" y="124" width="246.667" height="46" rx="8" fill="#e9f6f2" stroke="#207767" stroke-width="1.5"/>
  <text x="662.667" y="152" font-size="17" font-weight="700" fill="#207767">在构建目录核对</text>
  <rect x="539.333" y="187" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="215" font-size="16" font-weight="400" fill="#182e3d">zephyr_modules.txt</text>
  <text x="662.667" y="239" font-size="16" font-weight="400" fill="#182e3d">列出两个模块</text>
  <rect x="539.333" y="274" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="302" font-size="16" font-weight="400" fill="#182e3d">zephyr/zephyr.dts 可查控制</text>
  <text x="662.667" y="326" font-size="16" font-weight="400" fill="#182e3d">台，compile_commands.json</text>
  <text x="662.667" y="350" font-size="16" font-weight="400" fill="#182e3d">可查被选中的驱动和 DDL</text>
  </g>
</svg>
