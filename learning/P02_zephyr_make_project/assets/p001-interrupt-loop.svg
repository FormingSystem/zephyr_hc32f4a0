<svg xmlns="http://www.w3.org/2000/svg" width="800" height="324" viewBox="0 0 800 324" role="img" aria-labelledby="title desc"><title id="title">阶段二：中断保存事件，主循环不再忙等显示</title><desc id="desc">阶段二：中断保存事件，主循环不再忙等显示</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66788a"/></marker></defs><rect width="800" height="324" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243447"><text x="20" y="28" font-size="16" text-anchor="start" font-weight="600"><tspan x="20" dy="0">阶段二 · 接收及时，业务处理仍按主循环推进</tspan></text><rect x="20" y="60" width="210" height="76" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="125" y="92.5" font-size="16" text-anchor="middle"><tspan x="125" dy="0">鼠标 / 键盘报告</tspan><tspan x="125" dy="23">显示传输完成</tspan></text><rect x="295" y="60" width="210" height="76" rx="7" fill="#e6f3ec" stroke="#66788a"/><text x="400" y="92.5" font-size="16" text-anchor="middle"><tspan x="400" dy="0">短 ISR</tspan><tspan x="400" dy="23">保存报告或完成状态</tspan></text><rect x="570" y="60" width="210" height="76" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="675" y="92.5" font-size="16" text-anchor="middle"><tspan x="675" dy="0">内存事件队列</tspan><tspan x="675" dy="23">等待业务代码读取</tspan></text><path d="M230 98 H295" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M505 98 H570" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="570" y="204" width="210" height="76" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="675" y="236.5" font-size="16" text-anchor="middle"><tspan x="675" dy="0">主循环取事件</tspan><tspan x="675" dy="23">处理输入 / 提交显示</tspan></text><rect x="295" y="204" width="210" height="76" rx="7" fill="#fff1d8" stroke="#66788a"/><text x="400" y="236.5" font-size="16" text-anchor="middle"><tspan x="400" dy="0">连续计算曲线</tspan><tspan x="400" dy="23">暂时不检查队列</tspan></text><rect x="20" y="204" width="210" height="76" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="125" y="236.5" font-size="16" text-anchor="middle"><tspan x="125" dy="0">计算结束</tspan><tspan x="125" dy="23">回到事件处理</tspan></text><path d="M675 136 V204" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M570 242 H505" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M295 242 H230" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M125 280 V297 H675 V280" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="20" y="177" font-size="16" text-anchor="start"><tspan x="20" dy="0">显示传输由 DMA / SPI 继续执行，主循环不必陪它等。</tspan></text><text x="20" y="320" font-size="16" text-anchor="start"><tspan x="20" dy="0">ISR 返回后仍续算曲线；有中断通知，并不意味着已经完成输入业务处理。</tspan></text></g></svg>
