<svg xmlns="http://www.w3.org/2000/svg" width="800" height="462" viewBox="0 0 800 462" role="img" aria-labelledby="title desc">
  <title id="title">首次构建命令选择哪些文件</title>
  <desc id="desc">UCRT64 · Zephyr 源码根，route 和 module_args 在本章配置块中设置。-S 和 -DBOARD 固定应用与硬件。将 route 从 zip 改为 west 会改变模块的取得方式和输出目录，两次构建仍可使用同一份 main.c。</desc>
  <rect width="800" height="462" fill="#ffffff"/>
  <path d="M400 138 V155 M137.333 155 H662.667" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 155 V176" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 222 V239" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M137.333 309 V326" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M400 155 V176" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M400 222 V239" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M400 285 V302" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M662.667 155 V176" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M662.667 222 V239" fill="none" stroke="#207767" stroke-width="2"/>
  <path d="M662.667 285 V302" fill="none" stroke="#207767" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="126" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">UCRT64 · Zephyr 源码根，route 和 module_args 在本章配置块中设置</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">cmake -S samples/hello_world -B "build/learning-tools/first-ucrt-$route" -G Ninja \</text>
  <text x="400" y="90" font-size="17" font-weight="700" fill="#172d3e">-DBOARD=mps2/an386 "${module_args[@]}" \</text>
  <text x="400" y="116" font-size="17" font-weight="700" fill="#172d3e">-DCMAKE_EXPORT_COMPILE_COMMANDS=ON</text>
  <rect x="14" y="176" width="246.667" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="137.333" y="204" font-size="17" font-weight="700" fill="#25618b">应用与板</text>
  <rect x="14" y="239" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="267" font-size="16" font-weight="400" fill="#182e3d">-S samples/hello_world</text>
  <text x="137.333" y="291" font-size="16" font-weight="400" fill="#182e3d">-DBOARD=mps2/an386</text>
  <rect x="14" y="326" width="246.667" height="118" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="354" font-size="16" font-weight="400" fill="#182e3d">应用目录提供 src/main.c；板</text>
  <text x="137.333" y="378" font-size="16" font-weight="400" fill="#182e3d">目标在</text>
  <text x="137.333" y="402" font-size="16" font-weight="400" fill="#182e3d">boards/arm/mps2/board.yml</text>
  <text x="137.333" y="426" font-size="16" font-weight="400" fill="#182e3d">中登记 AN386</text>
  <rect x="276.667" y="176" width="246.667" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="400" y="204" font-size="17" font-weight="700" fill="#705197">模块与工具</text>
  <rect x="276.667" y="239" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="267" font-size="16" font-weight="400" fill="#182e3d">"${module_args[@]}"</text>
  <rect x="276.667" y="302" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="330" font-size="16" font-weight="400" fill="#182e3d">zip 路线传入本地 CMSIS 列</text>
  <text x="400" y="354" font-size="16" font-weight="400" fill="#182e3d">表；west 路线由工作区发现。</text>
  <text x="400" y="378" font-size="16" font-weight="400" fill="#182e3d">SDK 提供交叉编译器</text>
  <rect x="539.333" y="176" width="246.667" height="46" rx="8" fill="#e9f6f2" stroke="#207767" stroke-width="1.5"/>
  <text x="662.667" y="204" font-size="17" font-weight="700" fill="#207767">规则与产物</text>
  <rect x="539.333" y="239" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="267" font-size="16" font-weight="400" fill="#182e3d">-B 与 -G Ninja</text>
  <rect x="539.333" y="302" width="246.667" height="118" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="330" font-size="16" font-weight="400" fill="#182e3d">选定目录保存 build.ninja 和</text>
  <text x="662.667" y="354" font-size="16" font-weight="400" fill="#182e3d">compile_commands.json；执</text>
  <text x="662.667" y="378" font-size="16" font-weight="400" fill="#182e3d">行构建后得到</text>
  <text x="662.667" y="402" font-size="16" font-weight="400" fill="#182e3d">zephyr/zephyr.elf</text>
  </g>
</svg>
