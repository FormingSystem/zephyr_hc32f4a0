<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-labelledby="title desc"><title id="title">设备事件和定时器到期都可以触发重新调度</title><desc id="desc">设备事件和定时器到期都可以触发重新调度</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66788a"/></marker></defs><rect width="800" height="410" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243447"><text x="20" y="28" font-size="16" text-anchor="start" font-weight="600"><tspan x="20" dy="0">从“到事件 / 到时间”走到“选择可运行线程”</tspan></text><rect x="20" y="64" width="225" height="76" rx="7" fill="#e6f3ec" stroke="#66788a"/><text x="132.5" y="96.5" font-size="16" text-anchor="middle"><tspan x="132.5" dy="0">设备中断</tspan><tspan x="132.5" dy="23">报告到达 / 传输完成</tspan></text><rect x="20" y="194" width="225" height="76" rx="7" fill="#eee9f8" stroke="#66788a"/><text x="132.5" y="226.5" font-size="16" text-anchor="middle"><tspan x="132.5" dy="0">定时器中断</tspan><tspan x="132.5" dy="23">睡眠到期 / 等待超时</tspan></text><rect x="305" y="119" width="210" height="96" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="410" y="150" font-size="16" text-anchor="middle"><tspan x="410" dy="0">更新等待条件</tspan><tspan x="410" dy="23">符合条件的线程</tspan><tspan x="410" dy="23">进入就绪集合</tspan></text><rect x="575" y="119" width="205" height="96" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="677.5" y="150" font-size="16" text-anchor="middle"><tspan x="677.5" dy="0">调度器</tspan><tspan x="677.5" dy="23">按优先级和规则</tspan><tspan x="677.5" dy="23">选下一运行线程</tspan></text><path d="M245 102 H275 V145 H305" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M245 232 H275 V190 H305" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M515 167 H575" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="575" y="290" width="205" height="66" rx="7" fill="#fff1d8" stroke="#66788a"/><text x="677.5" y="317.5" font-size="16" text-anchor="middle"><tspan x="677.5" dy="0">需要换线程时</tspan><tspan x="677.5" dy="23">保存与恢复执行现场</tspan></text><path d="M678 215 V290" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="20" y="312" font-size="16" text-anchor="start"><tspan x="20" dy="0">定时器还可提供时间片到期通知。</tspan><tspan x="20" dy="23">就绪：可以参与选择；</tspan><tspan x="20" dy="23">阻塞：还在等待，不参与普通调度。</tspan></text><text x="20" y="396" font-size="16" text-anchor="start"><tspan x="20" dy="0">设备事件不必等下一节拍；中断退出时是否切换，取决于就绪状态与抢占条件。</tspan></text></g></svg>
