<svg xmlns="http://www.w3.org/2000/svg" width="800" height="362" viewBox="0 0 800 362" role="img" aria-labelledby="title desc">
  <title id="title">固定 hello_world，三次选板各需补哪些支持</title>
  <desc id="desc">三次配置均以 samples/hello_world 为应用。三个分支固定同一份 main.c。从官方板换到练习板，可以只补板级声明；换到 HC32 时，还要为新的片上外设接入 SoC 支持、驱动和厂商库。</desc>
