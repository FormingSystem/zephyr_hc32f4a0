<svg xmlns="http://www.w3.org/2000/svg" width="800" height="658" viewBox="0 0 800 658" role="img" aria-labelledby="title desc">
<title id="title">调度时序：键盘抢占显示，处理后显示继续</title><desc id="desc">教学假设：报告到达为零时刻；ISR 八微秒，切换六微秒，键盘处理三十微秒，再等待及切换六微秒。显示线程还需四百微秒计算。纵向间距不按时间比例。</desc>
<defs>
<style>text { paint-order: stroke; stroke: white; stroke-width: 4px; stroke-linejoin: round; }</style>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
<marker id="save" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b95309"/></marker>
<marker id="restore" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#15804a"/></marker>
<marker id="pointer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
</defs>
<rect width="800" height="658" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243447">
<text x="20" y="28" font-size="16" fill="#243447" font-weight="600" text-anchor="start">同一次事件：先处理按键，再接着准备像素</text>
<rect x="64" y="52" width="148" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<text x="138.0" y="78.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">控制器 / 接收驱动</text>
<path d="M138 94V495" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 4"/>
<rect x="256" y="52" width="148" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<text x="330.0" y="78.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">内核 / PendSV</text>
<path d="M330 94V495" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 4"/>
<rect x="446" y="52" width="148" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<text x="520.0" y="78.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">显示线程</text>
<path d="M520 94V495" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 4"/>
<rect x="636" y="52" width="148" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<text x="710.0" y="78.0" font-size="16" fill="#243447" font-weight="600" text-anchor="middle">键盘线程</text>
<path d="M710 94V495" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 4"/>
<rect x="512" y="98" width="16" height="42" rx="6" fill="#ffe4b4" stroke="#b88737" stroke-width="1.3"/>
<text x="389" y="119" font-size="16" fill="#243447" font-weight="400" text-anchor="start">准备像素</text>
<text x="18" y="145" font-size="16" fill="#243447" font-weight="400" text-anchor="start">0 μs</text>
<rect x="130" y="140" width="16" height="50" rx="6" fill="#dceaff" stroke="#2563eb" stroke-width="1.3"/>
<text x="157" y="152" font-size="16" fill="#2563eb" font-weight="400" text-anchor="start">报告到达</text>
<text x="350" y="157" font-size="16" fill="#b95309">① 异常入口压栈</text>
<text x="157" y="177" font-size="16" fill="#243447" font-weight="400" text-anchor="start">短接收处理</text>
<text x="18" y="195" font-size="16" fill="#243447" font-weight="400" text-anchor="start">8 μs</text>
<path d="M146 190H322" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<text x="157" y="211" font-size="16" fill="#7c3aed" font-weight="400" text-anchor="start">入队、唤醒</text>
<rect x="322" y="190" width="16" height="60" rx="6" fill="#eee4ff" stroke="#7c3aed" stroke-width="1.3"/>
<path d="M512 222H338" fill="none" stroke="#b95309" stroke-width="2.4" marker-end="url(#save)"/>
<text x="355" y="212" font-size="16" fill="#b95309" font-weight="400" text-anchor="start">② 保存显示现场</text>
<text x="18" y="255" font-size="16" fill="#243447" font-weight="400" text-anchor="start">14 μs</text>
<path d="M338 250H702" fill="none" stroke="#15804a" stroke-width="2.4" marker-end="url(#restore)"/>
<text x="424" y="241" font-size="16" fill="#15804a" font-weight="400" text-anchor="start">③④ 恢复键盘现场</text>
<rect x="702" y="250" width="16" height="115" rx="6" fill="#d6f1e1" stroke="#15804a" stroke-width="1.3"/>
<text x="560" y="285" font-size="16" fill="#243447" font-weight="400" text-anchor="start">取报告</text>
<text x="560" y="311" font-size="16" fill="#243447" font-weight="400" text-anchor="start">更新输入状态</text>
<text x="372" y="306" font-size="16" fill="#243447" font-weight="400" text-anchor="start">显示保持就绪</text>
<text x="18" y="370" font-size="16" fill="#243447" font-weight="400" text-anchor="start">44 μs</text>
<path d="M702 365H338" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<text x="415" y="356" font-size="16" fill="#7c3aed" font-weight="400" text-anchor="start">队列已空，再次阻塞等待</text>
<rect x="322" y="365" width="16" height="60" rx="6" fill="#eee4ff" stroke="#7c3aed" stroke-width="1.3"/>
<path d="M338 425H512" fill="none" stroke="#15804a" stroke-width="2.4" marker-end="url(#restore)"/>
<text x="354" y="415" font-size="16" fill="#15804a" font-weight="400" text-anchor="start">恢复显示现场</text>
<text x="18" y="430" font-size="16" fill="#243447" font-weight="400" text-anchor="start">50 μs</text>
<rect x="512" y="425" width="16" height="65" rx="6" fill="#ffe4b4" stroke="#b88737" stroke-width="1.3"/>
<text x="545" y="452" font-size="16" fill="#243447" font-weight="400" text-anchor="start">接着准备像素</text>
<text x="545" y="478" font-size="16" fill="#243447" font-weight="400" text-anchor="start">随后调用显示驱动</text>
<text x="12" y="495" font-size="16" fill="#243447" font-weight="400" text-anchor="start">450 μs</text>
<path d="M528 490H570" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<text x="610" y="115" font-size="16" fill="#243447" font-weight="400" text-anchor="start">等报告：阻塞</text>
<text x="610" y="390" font-size="16" fill="#243447" font-weight="400" text-anchor="start">无报告：阻塞</text>
<text x="20" y="526" font-size="16" fill="#243447" font-weight="400" text-anchor="start">键盘只在 14–44 μs 处理已有报告；到达前与处理完后均阻塞，不耗满时间片。</text>
<path d="M20 551h22" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#data)"/>
<text x="50" y="556" font-size="16" fill="#243447" font-weight="400" text-anchor="start">蓝：数据/调用</text>
<path d="M220 551h22" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#control)"/>
<text x="250" y="556" font-size="16" fill="#243447" font-weight="400" text-anchor="start">紫：唤醒/阻塞</text>
<path d="M430 551h22" fill="none" stroke="#b95309" stroke-width="2.4" marker-end="url(#save)"/>
<text x="460" y="556" font-size="16" fill="#243447" font-weight="400" text-anchor="start">橙：保存现场</text>
<path d="M620 551h22" fill="none" stroke="#15804a" stroke-width="2.4" marker-end="url(#restore)"/>
<text x="650" y="556" font-size="16" fill="#243447" font-weight="400" text-anchor="start">绿：恢复现场</text>
<rect x="20" y="572" width="14" height="14" rx="6" fill="#dceaff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="42" y="585" font-size="16" fill="#243447" font-weight="400" text-anchor="start">浅蓝：接收处理</text>
<rect x="220" y="572" width="14" height="14" rx="6" fill="#eee4ff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="242" y="585" font-size="16" fill="#243447" font-weight="400" text-anchor="start">浅紫：内核切换</text>
<rect x="430" y="572" width="14" height="14" rx="6" fill="#d6f1e1" stroke="#94a3b8" stroke-width="1.3"/>
<text x="452" y="585" font-size="16" fill="#243447" font-weight="400" text-anchor="start">浅绿：键盘业务</text>
<rect x="620" y="572" width="14" height="14" rx="6" fill="#ffe4b4" stroke="#94a3b8" stroke-width="1.3"/>
<text x="642" y="585" font-size="16" fill="#243447" font-weight="400" text-anchor="start">浅黄：像素准备</text>
<text x="20" y="615" font-size="16" fill="#243447" font-weight="400" text-anchor="start">灰色竖虚线是生命线，不表示占用 CPU；窄执行条才表示正在运行。</text>
<text x="20" y="644" font-size="16" fill="#243447" font-weight="400" text-anchor="start">教学数值，非实测；纵向间距不按时间比例。显示此时有像素准备工作。</text>
</g></svg>
