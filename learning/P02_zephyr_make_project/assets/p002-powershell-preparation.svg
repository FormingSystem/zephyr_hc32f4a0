<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Windows PowerShell 路线的工具源码和项目环境</title>
<desc id="desc">Windows PowerShell 路线的工具源码和项目环境。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="20" y="25" width="270" height="75" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="155.0" y="56.5" text-anchor="middle" font-weight="700">Windows x64 主机</text>
<text x="155.0" y="80.5" text-anchor="middle">PowerShell：输入与执行命令</text>
<rect x="430" y="25" width="310" height="75" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="585.0" y="56.5" text-anchor="middle" font-weight="700">主机程序</text>
<text x="585.0" y="80.5" text-anchor="middle">Git / CMake / Ninja / Python</text>
<polyline points="290,62 430,62" fill="none" stroke="#b45b13" stroke-width="2" marker-end="url(#orange)"/>
<text x="340" y="48" text-anchor="start" fill="#b45b13">调用</text>
<rect x="20" y="170" width="270" height="85" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="155.0" y="206.5" text-anchor="middle" font-weight="700">Git 克隆 或 浏览器 ZIP</text>
<text x="155.0" y="230.5" text-anchor="middle">选择一条取得源码的路线</text>
<rect x="430" y="170" width="310" height="85" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="585.0" y="194.5" text-anchor="middle" font-weight="700">你选择的源码文件夹</text>
<text x="585.0" y="218.5" text-anchor="middle">例如 G:\zephyr_practice</text>
<text x="585.0" y="242.5" text-anchor="middle">内的 zephyr-main</text>
<polyline points="290,212 430,212" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<text x="315" y="197" text-anchor="start" fill="#217346">下载 / 解压</text>
<rect x="430" y="315" width="310" height="65" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="585.0" y="341.5" text-anchor="middle" font-weight="700">Windows Python 创建 .venv</text>
<text x="585.0" y="365.5" text-anchor="middle">项目依赖装入这份环境</text>
<polyline points="585,100 585,170" fill="none" stroke="#b45b13" stroke-width="2" marker-end="url(#orange)"/>
<polyline points="585,255 585,315" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<text x="25" y="345" text-anchor="start" font-weight="700">工具运行在电脑上；</text>
<text x="25" y="373" text-anchor="start">此时还没有在芯片上执行固件。</text>
<line x1="24" y1="413" x2="48" y2="413" stroke="#1769aa"/>
<text x="54" y="418" text-anchor="start">主机/取得方式</text>
<line x1="188" y1="413" x2="212" y2="413" stroke="#b45b13"/>
<text x="218" y="418" text-anchor="start">主机工具</text>
<line x1="304" y1="413" x2="328" y2="413" stroke="#217346"/>
<text x="334" y="418" text-anchor="start">磁盘源码</text>
<line x1="420" y1="413" x2="444" y2="413" stroke="#7540a0"/>
<text x="450" y="418" text-anchor="start">项目环境</text>
</g></svg>