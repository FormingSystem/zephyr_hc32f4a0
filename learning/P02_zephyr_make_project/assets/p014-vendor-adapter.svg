<svg xmlns="http://www.w3.org/2000/svg" width="760" height="465" viewBox="0 0 760 465" role="img" aria-labelledby="title desc">
<title id="title">厂商源码与 Zephyr 适配分别承担什么责任</title>
<desc id="desc">厂商源码与 Zephyr 适配分别承担什么责任。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="20" y="25" width="320" height="100" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="180.0" y="57.0" text-anchor="middle" font-weight="700">厂商 HAL / DDL 包</text>
<text x="180.0" y="81.0" text-anchor="middle">设备头：寄存器与芯片定义</text>
<text x="180.0" y="105.0" text-anchor="middle">底层函数：控制具体硬件</text>
<rect x="420" y="25" width="320" height="100" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="580.0" y="57.0" text-anchor="middle" font-weight="700">Zephyr 适配代码</text>
<text x="580.0" y="81.0" text-anchor="middle">SoC / board / 驱动接入</text>
<text x="580.0" y="105.0" text-anchor="middle">把系统接口连接到该芯片</text>
<polyline points="340,75 420,75" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<text x="350" y="57" text-anchor="start" fill="#7540a0">被使用</text>
<rect x="20" y="215" width="320" height="85" rx="8" fill="#fff0df" stroke="#b45b13" stroke-width="1.5"/>
<text x="180.0" y="251.5" text-anchor="middle" font-weight="700">应用调用标准设备 API</text>
<text x="180.0" y="275.5" text-anchor="middle">持有本次设备实例</text>
<rect x="420" y="215" width="320" height="85" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="580.0" y="251.5" text-anchor="middle" font-weight="700">HC32 驱动实现</text>
<text x="580.0" y="275.5" text-anchor="middle">使用实例配置，调用所选 DDL</text>
<polyline points="340,257 420,257" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<polyline points="580,125 580,215" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<rect x="420" y="355" width="320" height="60" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="580.0" y="379.0" text-anchor="middle" font-weight="700">HC32 外设寄存器 / 硬件</text>
<text x="580.0" y="403.0" text-anchor="middle">实际读写由驱动链完成</text>
<polyline points="580,300 580,355" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<text x="25" y="366" text-anchor="start">上排：源码职责和接入。</text>
<text x="25" y="394" text-anchor="start">下排：固件中的运行调用。</text>
<line x1="24" y1="438" x2="48" y2="438" stroke="#1769aa"/>
<text x="54" y="443" text-anchor="start">厂商代码</text>
