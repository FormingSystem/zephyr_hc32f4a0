<svg xmlns="http://www.w3.org/2000/svg" width="800" height="414" viewBox="0 0 800 414" role="img" aria-labelledby="title desc">
  <title id="title">当前终端能运行哪份构建工具</title>
  <desc id="desc">Windows · UCRT64 Bash。终端身份、工具位置和 Python 版本各有自己的检查方法。MSYSTEM 显示 UCRT64 后，还要看 CMake、Ninja 与解释器分别解析到了哪里。</desc>
  <rect width="800" height="414" fill="#ffffff"/>
  <path d="M400 138 V155 M137.333 155 H662.667" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 155 V176" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 222 V239" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M137.333 285 V302" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M400 155 V176" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M400 222 V239" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M400 285 V302" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M662.667 155 V176" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M662.667 222 V239" fill="none" stroke="#207767" stroke-width="2"/>
  <path d="M662.667 285 V302" fill="none" stroke="#207767" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="126" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">Windows · UCRT64 Bash</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">echo "$MSYSTEM"</text>
  <text x="400" y="90" font-size="17" font-weight="700" fill="#172d3e">type -a cmake ninja dtc gperf 7z cygpath</text>
  <text x="400" y="116" font-size="17" font-weight="700" fill="#172d3e">py -3.12 --version</text>
  <rect x="14" y="176" width="246.667" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="137.333" y="204" font-size="17" font-weight="700" fill="#25618b">Bash 所在环境</text>
  <rect x="14" y="239" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="267" font-size="16" font-weight="400" fill="#182e3d">echo "$MSYSTEM"</text>
  <rect x="14" y="302" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="330" font-size="16" font-weight="400" fill="#182e3d">预期为 UCRT64；进入同名目</text>
  <text x="137.333" y="354" font-size="16" font-weight="400" fill="#182e3d">录不会切换终端环境</text>
  <rect x="276.667" y="176" width="246.667" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="400" y="204" font-size="17" font-weight="700" fill="#705197">配置与执行工具</text>
  <rect x="276.667" y="239" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="267" font-size="16" font-weight="400" fill="#182e3d">type -a</text>
  <rect x="276.667" y="302" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="330" font-size="16" font-weight="400" fill="#182e3d">查看实际程序的搜索顺序；本</text>
  <text x="400" y="354" font-size="16" font-weight="400" fill="#182e3d">路线使用 UCRT64 的 CMake</text>
  <text x="400" y="378" font-size="16" font-weight="400" fill="#182e3d">和 Ninja</text>
  <rect x="539.333" y="176" width="246.667" height="46" rx="8" fill="#e9f6f2" stroke="#207767" stroke-width="1.5"/>
  <text x="662.667" y="204" font-size="17" font-weight="700" fill="#207767">基础解释器</text>
  <rect x="539.333" y="239" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="267" font-size="16" font-weight="400" fill="#182e3d">py -3.12 --version</text>
  <rect x="539.333" y="302" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="330" font-size="16" font-weight="400" fill="#182e3d">核对 Windows Python 版本</text>
  <text x="662.667" y="354" font-size="16" font-weight="400" fill="#182e3d">后，以它创建源码根下的 .venv</text>
  </g>
</svg>
