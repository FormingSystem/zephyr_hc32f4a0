<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title desc">
<title id="title">Windows 与 UCRT64 对同一目录使用两种路径表示</title>
<desc id="desc">Windows 与 UCRT64 对同一目录使用两种路径表示。原创教学示意；箭头与颜色含义见图内图例和正文。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7540a0"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45b13"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#217346"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#667080"/></marker>
</defs>
<rect width="760" height="100%" fill="#fff"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#243447">
<rect x="20" y="25" width="300" height="80" rx="8" fill="#e8f2fc" stroke="#1769aa" stroke-width="1.5"/>
<text x="170.0" y="59.0" text-anchor="middle" font-weight="700">资源管理器里的 Windows 路径</text>
<text x="170.0" y="83.0" text-anchor="middle">G:\zephyr_practice</text>
<rect x="440" y="25" width="300" height="80" rx="8" fill="#f1eafa" stroke="#7540a0" stroke-width="1.5"/>
<text x="590.0" y="59.0" text-anchor="middle" font-weight="700">UCRT64 Bash 的路径</text>
<text x="590.0" y="83.0" text-anchor="middle">/g/zephyr_practice</text>
<polyline points="320,65 440,65" fill="none" stroke="#7540a0" stroke-width="2" marker-end="url(#purple)"/>
<text x="330" y="44" text-anchor="start" fill="#7540a0">cygpath -u</text>
<rect x="180" y="205" width="400" height="65" rx="8" fill="#e8f5ec" stroke="#217346" stroke-width="1.5"/>
<text x="380.0" y="231.5" text-anchor="middle" font-weight="700">同一个磁盘目录</text>
<text x="380.0" y="255.5" text-anchor="middle">转换写法，不复制或重新下载文件</text>
<polyline points="170,105 170,238 180,238" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<polyline points="590,105 590,238 580,238" fill="none" stroke="#217346" stroke-width="2" marker-end="url(#green)"/>
<text x="25" y="313" text-anchor="start">先用 read -r 接收反斜杠路径，再转换；空格路径仍需加引号。</text>
<line x1="24" y1="338" x2="48" y2="338" stroke="#1769aa"/>
<text x="54" y="343" text-anchor="start">Windows 写法</text>
<line x1="236" y1="338" x2="260" y2="338" stroke="#7540a0"/>
<text x="266" y="343" text-anchor="start">Bash 写法/转换</text>
<line x1="448" y1="338" x2="472" y2="338" stroke="#217346"/>
<text x="478" y="343" text-anchor="start">同一目录</text>
</g></svg>