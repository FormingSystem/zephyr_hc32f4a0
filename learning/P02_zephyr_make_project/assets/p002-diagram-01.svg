<svg xmlns="http://www.w3.org/2000/svg" width="800" height="499" viewBox="0 0 800 499" role="img" aria-labelledby="title desc">
  <title id="title">同一份 hello_world 怎样用到板、驱动与外部模块</title>
  <desc id="desc">UCRT64 · Zephyr 源码根，已准备 west 工作区与 SDK。换板时从硬件目标这一支查声明和资源；追查字符输出时从控制台这一支找驱动。源码所在的主仓或外部模块决定构建怎样找到它。</desc>
  <rect width="800" height="499" fill="#ffffff"/>
  <path d="M400 112 V129 M137.333 129 H662.667" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 129 V150" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 196 V213" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M137.333 283 V300" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M400 129 V150" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M400 196 V213" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M400 259 V276" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M662.667 129 V150" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M662.667 196 V213" fill="none" stroke="#207767" stroke-width="2"/>
  <path d="M662.667 259 V276" fill="none" stroke="#207767" stroke-width="2"/>
  <path d="M662.667 370 V387" fill="none" stroke="#207767" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="100" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">UCRT64 · Zephyr 源码根，已准备 west 工作区与 SDK</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">west build -b mps2/an386 -d build/learning-tools/p010/west-an386 \</text>
  <text x="400" y="90" font-size="17" font-weight="700" fill="#172d3e">samples/hello_world -- -DCMAKE_EXPORT_COMPILE_COMMANDS=ON</text>
  <rect x="14" y="150" width="246.667" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="137.333" y="178" font-size="17" font-weight="700" fill="#25618b">硬件目标</text>
  <rect x="14" y="213" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="241" font-size="16" font-weight="400" fill="#182e3d">boards/arm/mps2 →</text>
  <text x="137.333" y="265" font-size="16" font-weight="400" fill="#182e3d">soc/arm/mps2</text>
  <rect x="14" y="300" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="328" font-size="16" font-weight="400" fill="#182e3d">板选择 AN386，SoC 选用</text>
  <text x="137.333" y="352" font-size="16" font-weight="400" fill="#182e3d">Cortex-M4，共用 arch/arm</text>
  <text x="137.333" y="376" font-size="16" font-weight="400" fill="#182e3d">的架构支持</text>
  <rect x="276.667" y="150" width="246.667" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="400" y="178" font-size="17" font-weight="700" fill="#705197">控制台设备</text>
  <rect x="276.667" y="213" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="241" font-size="16" font-weight="400" fill="#182e3d">板 DTS 的 zephyr,console</text>
  <rect x="276.667" y="276" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="304" font-size="16" font-weight="400" fill="#182e3d">控制台经 UART 公共接口调用</text>
  <text x="400" y="328" font-size="16" font-weight="400" fill="#182e3d">CMSDK 驱动，驱动访问该实</text>
  <text x="400" y="352" font-size="16" font-weight="400" fill="#182e3d">例的寄存器</text>
  <rect x="539.333" y="150" width="246.667" height="46" rx="8" fill="#e9f6f2" stroke="#207767" stroke-width="1.5"/>
  <text x="662.667" y="178" font-size="17" font-weight="700" fill="#207767">源码放置</text>
  <rect x="539.333" y="213" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="241" font-size="16" font-weight="400" fill="#182e3d">主仓驱动与外部模块</text>
  <rect x="539.333" y="276" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="304" font-size="16" font-weight="400" fill="#182e3d">CMSIS_6 提供内核头文件；换</text>
  <text x="662.667" y="328" font-size="16" font-weight="400" fill="#182e3d">用 HC32 适配时，其 UART 驱</text>
  <text x="662.667" y="352" font-size="16" font-weight="400" fill="#182e3d">动可调用外部厂商 DDL</text>
  <rect x="539.333" y="387" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="415" font-size="16" font-weight="400" fill="#182e3d">在 -d 指定目录的</text>
  <text x="662.667" y="439" font-size="16" font-weight="400" fill="#182e3d">compile_commands.json 中</text>
  <text x="662.667" y="463" font-size="16" font-weight="400" fill="#182e3d">检查实际选源</text>
  </g>
</svg>
