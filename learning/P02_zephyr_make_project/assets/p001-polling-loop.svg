<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc"><title id="title">阶段一：主循环逐项处理，显示忙等挡住输入</title><desc id="desc">阶段一：主循环逐项处理，显示忙等挡住输入</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66788a"/></marker></defs><rect width="800" height="300" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243447"><text x="20" y="28" font-size="18" text-anchor="start" font-weight="600"><tspan x="20" dy="0">阶段一 · 单条执行流程</tspan></text><rect x="20" y="60" width="200" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="120" y="87.5" font-size="16" text-anchor="middle"><tspan x="120" dy="0">① 查鼠标状态</tspan><tspan x="120" dy="23">有报告才读取</tspan></text><rect x="300" y="60" width="200" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="400" y="87.5" font-size="16" text-anchor="middle"><tspan x="400" dy="0">② 查键盘状态</tspan><tspan x="400" dy="23">有报告才读取</tspan></text><rect x="580" y="60" width="200" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="680" y="87.5" font-size="16" text-anchor="middle"><tspan x="680" dy="0">③ 准备像素</tspan><tspan x="680" dy="23">启动 DMA / SPI</tspan></text><rect x="580" y="190" width="200" height="66" rx="7" fill="#fbe9e7" stroke="#66788a"/><text x="680" y="217.5" font-size="16" text-anchor="middle"><tspan x="680" dy="0">④ 循环查完成状态</tspan><tspan x="680" dy="23">CPU 忙等</tspan></text><rect x="300" y="190" width="200" height="66" rx="7" fill="#fff1d8" stroke="#66788a"/><text x="400" y="217.5" font-size="16" text-anchor="middle"><tspan x="400" dy="0">⑤ 计算曲线</tspan><tspan x="400" dy="23">连续占用 CPU</tspan></text><rect x="20" y="190" width="200" height="66" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="120" y="217.5" font-size="16" text-anchor="middle"><tspan x="120" dy="0">⑥ 回到本轮起点</tspan><tspan x="120" dy="23">再次检查输入</tspan></text><path d="M220 93 H300" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M500 93 H580" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M680 126 V190" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M580 223 H500" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M300 223 H220" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M120 190 V126" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="20" y="286" font-size="16" text-anchor="start"><tspan x="20" dy="0">④ 等待硬件，⑤ 执行计算：主循环在这两段期间都不能再次处理输入。</tspan></text></g></svg>
