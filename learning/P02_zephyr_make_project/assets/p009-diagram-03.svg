<svg xmlns="http://www.w3.org/2000/svg" width="800" height="386" viewBox="0 0 800 386" role="img" aria-labelledby="title desc">
  <title id="title">west 到哪里寻找 build 的实现</title>
  <desc id="desc">在已建立的 Zephyr 工作区 · 查看当前版本的构建扩展。从 west build --help 里的 build 可以追到清单、命令声明和 Build 类。换一份 Zephyr 源码，这条查找路径会带到那份源码提供的实现。</desc>
  <rect width="800" height="386" fill="#ffffff"/>
  <path d="M400 86 V103 M137.333 103 H662.667" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M137.333 170 V187" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M137.333 233 V250" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M400 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M400 170 V187" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M400 233 V250" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M662.667 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M662.667 170 V187" fill="none" stroke="#207767" stroke-width="2"/>
  <path d="M662.667 257 V274" fill="none" stroke="#207767" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="74" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">在已建立的 Zephyr 工作区 · 查看当前版本的构建扩展</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">west build --help</text>
  <rect x="14" y="124" width="246.667" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="137.333" y="152" font-size="17" font-weight="700" fill="#25618b">谁提供入口</text>
  <rect x="14" y="187" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="215" font-size="16" font-weight="400" fill="#182e3d">项目环境中的 west</text>
  <rect x="14" y="250" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="137.333" y="278" font-size="16" font-weight="400" fill="#182e3d">west 核心读取活动清单；</text>
  <text x="137.333" y="302" font-size="16" font-weight="400" fill="#182e3d">Zephyr 的 west.yml 在 self 项</text>
  <text x="137.333" y="326" font-size="16" font-weight="400" fill="#182e3d">下登记 west-commands</text>
  <rect x="276.667" y="124" width="246.667" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="400" y="152" font-size="17" font-weight="700" fill="#705197">在哪里登记</text>
  <rect x="276.667" y="187" width="246.667" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="215" font-size="16" font-weight="400" fill="#182e3d">scripts/west-commands.yml</text>
  <rect x="276.667" y="250" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="400" y="278" font-size="16" font-weight="400" fill="#182e3d">name: build 对应 class: Build</text>
  <text x="400" y="302" font-size="16" font-weight="400" fill="#182e3d">file 字段给出实现文件</text>
  <rect x="539.333" y="124" width="246.667" height="46" rx="8" fill="#e9f6f2" stroke="#207767" stroke-width="1.5"/>
  <text x="662.667" y="152" font-size="17" font-weight="700" fill="#207767">由谁解释参数</text>
  <rect x="539.333" y="187" width="246.667" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="215" font-size="16" font-weight="400" fill="#182e3d">scripts/west_commands/</text>
  <text x="662.667" y="239" font-size="16" font-weight="400" fill="#182e3d">build.py</text>
  <rect x="539.333" y="274" width="246.667" height="94" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="662.667" y="302" font-size="16" font-weight="400" fill="#182e3d">Build 类定义当前 Zephyr 版本</text>
  <text x="662.667" y="326" font-size="16" font-weight="400" fill="#182e3d">的 build 子命令，--help 列出</text>
  <text x="662.667" y="350" font-size="16" font-weight="400" fill="#182e3d">支持的选项</text>
  </g>
</svg>
