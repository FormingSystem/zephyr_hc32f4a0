<svg xmlns="http://www.w3.org/2000/svg" width="800" height="362" viewBox="0 0 800 362" role="img" aria-labelledby="title desc">
  <title id="title">从 soc.h 的包含关系找到两个头文件搜索目录</title>
  <desc id="desc">HC32 适配模块 · soc/xhsc/hc32f4a0。从 soc.h 可追到厂商设备头，再由设备头追到 core_cm4.h。打开一条 SoC 源文件的编译记录，可以分别查到厂商目录和 CMSIS Core 目录。</desc>
  <rect width="800" height="362" fill="#ffffff"/>
  <path d="M400 86 V103 M203 103 H597" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M203 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M203 170 V187" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M203 257 V274" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M597 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M597 170 V187" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M597 233 V250" fill="none" stroke="#705197" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="74" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">HC32 适配模块 · soc/xhsc/hc32f4a0</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">soc.h</text>
  <rect x="14" y="124" width="378" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="203" y="152" font-size="17" font-weight="700" fill="#25618b">厂商器件与系统定义</text>
  <rect x="14" y="187" width="378" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="215" font-size="16" font-weight="400" fill="#182e3d">#include &lt;hc32f4a0.h&gt;</text>
  <text x="203" y="239" font-size="16" font-weight="400" fill="#182e3d">#include &lt;system_hc32f4a0.h&gt;</text>
  <rect x="14" y="274" width="378" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="302" font-size="16" font-weight="400" fill="#182e3d">SoC 的 CMakeLists.txt 加入 HAL 中</text>
  <text x="203" y="326" font-size="16" font-weight="400" fill="#182e3d">hc32_ddl/hc32f4a0/soc 的搜索路径</text>
  <rect x="408" y="124" width="378" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="597" y="152" font-size="17" font-weight="700" fill="#705197">器件头所需的内核接口</text>
  <rect x="408" y="187" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="597" y="215" font-size="16" font-weight="400" fill="#182e3d">hc32f4a0.h 引用 core_cm4.h</text>
  <rect x="408" y="250" width="378" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="597" y="278" font-size="16" font-weight="400" fill="#182e3d">CMSIS_6 模块规则将 CMSIS/Core/Include 加入</text>
  <text x="597" y="302" font-size="16" font-weight="400" fill="#182e3d">同一编译命令</text>
  </g>
</svg>
