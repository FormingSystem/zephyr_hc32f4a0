<svg xmlns="http://www.w3.org/2000/svg" width="800" height="412" viewBox="0 0 800 412" role="img" aria-labelledby="title desc"><title id="title">CPU 怎样与键盘、鼠标和显示屏通信</title><desc id="desc">外接键盘鼠标由片内 USB 主机控制器接收，CPU 通过 RAM 准备像素，DMA 将像素送到 SPI，再传到外接显示屏。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66788a"/></marker></defs><rect width="800" height="412" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243447"><rect x="200" y="20" width="390" height="360" rx="9" fill="#f8fafc" stroke="#66788a" stroke-dasharray="6 4"/><text x="220" y="46" font-size="16" text-anchor="start" font-weight="600"><tspan x="220" dy="0">MCU 内部模块</tspan></text><rect x="20" y="75" width="150" height="56" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="95" y="109" font-size="16" text-anchor="middle"><tspan x="95" dy="0">鼠标</tspan></text><rect x="20" y="160" width="150" height="56" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="95" y="194" font-size="16" text-anchor="middle"><tspan x="95" dy="0">键盘</tspan></text><rect x="220" y="85" width="150" height="100" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="295" y="129.5" font-size="16" text-anchor="middle"><tspan x="295" dy="0">USB 主机</tspan><tspan x="295" dy="23">控制器</tspan></text><rect x="410" y="85" width="150" height="100" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="485" y="129.5" font-size="16" text-anchor="middle"><tspan x="485" dy="0">CPU</tspan><tspan x="485" dy="23">执行软件</tspan></text><rect x="410" y="225" width="150" height="56" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="485" y="259" font-size="16" text-anchor="middle"><tspan x="485" dy="0">RAM / 像素</tspan></text><rect x="220" y="225" width="150" height="56" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="295" y="259" font-size="16" text-anchor="middle"><tspan x="295" dy="0">DMA</tspan></text><rect x="220" y="310" width="150" height="50" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="295" y="341" font-size="16" text-anchor="middle"><tspan x="295" dy="0">SPI 控制器</tspan></text><rect x="640" y="310" width="140" height="50" rx="7" fill="#eaf2fc" stroke="#66788a"/><text x="710" y="341" font-size="16" text-anchor="middle"><tspan x="710" dy="0">显示屏</tspan></text><path d="M170 103 H220" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 188 H190 V165 H220" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M370 118 H410" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="105" font-size="16" text-anchor="middle"><tspan x="390" dy="0">报告</tspan></text><path d="M370 165 H410" fill="none" stroke="#66788a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="390" y="202" font-size="16" text-anchor="middle"><tspan x="390" dy="0">IRQ 通知</tspan></text><path d="M485 185 V225" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="525" y="213" font-size="16" text-anchor="middle"><tspan x="525" dy="0">写像素</tspan></text><path d="M410 253 H370" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M295 281 V310" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M370 335 H640" fill="none" stroke="#66788a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="500" y="326" font-size="16" text-anchor="middle"><tspan x="500" dy="0">发送像素</tspan></text><text x="20" y="402" font-size="16" text-anchor="start"><tspan x="20" dy="0">实线：数据路径　虚线箭头：事件通知　图中省略 CPU 对控制器的配置连线</tspan></text></g></svg>
