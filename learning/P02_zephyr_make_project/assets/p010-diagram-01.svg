<svg xmlns="http://www.w3.org/2000/svg" width="800" height="425" viewBox="0 0 800 425" role="img" aria-labelledby="title desc">
  <title id="title">同一应用换板后复用哪一层支持</title>
  <desc id="desc">应用保持 samples/hello_world · 比较两次构建的 BOARD 值。从两项 BOARD 分别向下读，两边都选到 Cortex-M4，可复用 arch/arm/core/cortex_m。再看最下方，串口对应的驱动和寄存器实现随芯片改变。</desc>
  <rect width="800" height="425" fill="#ffffff"/>
  <path d="M400 86 V103 M203 103 H597" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M203 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M203 170 V187" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M203 257 V274" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M203 344 V361" fill="none" stroke="#25618b" stroke-width="2"/>
  <path d="M597 103 V124" fill="none" stroke="#6c808a" stroke-width="2"/>
  <path d="M597 170 V187" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M597 233 V250" fill="none" stroke="#705197" stroke-width="2"/>
  <path d="M597 320 V337" fill="none" stroke="#705197" stroke-width="2"/>
  <g text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="14" y="12" width="772" height="74" rx="8" fill="#edf3f6" stroke="#37586a" stroke-width="1.5"/>
  <text x="400" y="37" font-size="16" font-weight="400" fill="#435f70">应用保持 samples/hello_world · 比较两次构建的 BOARD 值</text>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#172d3e">BOARD</text>
  <rect x="14" y="124" width="378" height="46" rx="8" fill="#e9f4fb" stroke="#25618b" stroke-width="1.5"/>
  <text x="203" y="152" font-size="17" font-weight="700" fill="#25618b">mps2/an386</text>
  <rect x="14" y="187" width="378" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="215" font-size="16" font-weight="400" fill="#182e3d">boards/arm/mps2</text>
  <text x="203" y="239" font-size="16" font-weight="400" fill="#182e3d">板清单登记 an386</text>
  <rect x="14" y="274" width="378" height="70" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="302" font-size="16" font-weight="400" fill="#182e3d">soc/arm/mps2</text>
  <text x="203" y="326" font-size="16" font-weight="400" fill="#182e3d">选中 Cortex-M4</text>
  <rect x="14" y="361" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
  <text x="203" y="389" font-size="16" font-weight="400" fill="#182e3d">使用 CMSDK UART 驱动</text>
  <rect x="408" y="124" width="378" height="46" rx="8" fill="#f4eff9" stroke="#705197" stroke-width="1.5"/>
  <text x="597" y="152" font-size="17" font-weight="700" fill="#705197">uyup_rpi_a/hc32f4a0pitb</text>
  <rect x="408" y="187" width="378" height="46" rx="8" fill="#ffffff" stroke="#9bacb6" stroke-width="1.5"/>
